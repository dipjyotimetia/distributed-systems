openapi: 3.0.3
info:
  title: AI Service
  description: Provider catalogue and fan-out chat.
  version: 1.0.0
servers:
  - url: http://banking-ai:8080
    description: AI service
paths:
  /api/providers:
    get:
      operationId: listProviders
      summary: List chat providers
      security: []
      responses:
        '200':
          description: Provider metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderResult'
              example:
                - provider: anthropic
                  name: Anthropic Claude
                  model: claude-sonnet-4-20250514
  /api/chat:
    post:
      operationId: chat
      summary: Send one message to every provider
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: journey-success-ada
              locale: fr-CA
      responses:
        '200':
          description: One result per provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              example:
                results:
                  - provider: anthropic
                    name: Anthropic Claude
                    model: claude-sonnet-4-20250514
                    message: hello
                    durationMs: 12
        '422':
          description: Message is missing
components:
  schemas:
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
        accountContext:
          type: string
          default: ''
        locale:
          type: string
          default: en-US
    ProviderResult:
      type: object
      required: [provider, name, model]
      properties:
        provider:
          type: string
        name:
          type: string
        model:
          type: string
        message:
          type: string
          default: ''
        error:
          type: string
          nullable: true
        durationMs:
          type: integer
          default: 0
    ChatResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProviderResult'
