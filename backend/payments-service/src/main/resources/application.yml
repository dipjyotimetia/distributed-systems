spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${PAYMENTS_DB_URL}
    username: ${PAYMENTS_DB_USER}
    password: ${PAYMENTS_DB_PASSWORD}
  flyway:
    default-schema: payments
    schemas: payments
    create-schemas: false
server:
  error:
    include-message: never
  shutdown: graceful
otel:
  service:
    name: payments-service
  metrics:
    exporter: none
  logs:
    exporter: none
  traces:
    exporter: ${PAYMENTS_TRACES_EXPORTER:none}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
