openapi: 3.0.3
info:
  title: Accounts Service
  description: API for managing bank accounts.
  version: 1.0.0
servers:
  - url: http://localhost:8082/api
    description: Local development server
paths:
  /accounts:
    get:
      operationId: listAccounts
      summary: Get accounts for the authenticated user
      description: Returns an array when no filter or page parameter is present, and a page otherwise.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Account array, or a page when any query parameter is supplied
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AccountList'
                  - $ref: '#/components/schemas/AccountPage'
              examples:
                list:
                  summary: Unfiltered list
                  value:
                    - id: 1
                      userId: 7
                      accountNumber: '123456789012'
                      balance: 100.0
                      accountType: CHECKING
                      currency: USD
                      status: ACTIVE
                      createdAt: '2026-01-01T00:00:00'
                      updatedAt: '2026-01-01T00:00:00'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAccount
      summary: Create a new account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
            example:
              accountType: SAVINGS
              initialBalance: 25.0
              currency: USD
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: 1
                userId: 7
                accountNumber: '123456789012'
                balance: 25.0
                accountType: SAVINGS
                currency: USD
                status: ACTIVE
                createdAt: '2026-01-01T00:00:00'
                updatedAt: '2026-01-01T00:00:00'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/search:
    get:
      operationId: searchAccounts
      summary: Search owned accounts by number or type
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Matching account page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/summary:
    get:
      operationId: summarizeAccounts
      summary: Summarize owned accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account counts and balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
              example:
                totalAccounts: 2
                activeAccounts: 2
                totalBalance: 125.0
                accountsByType:
                  CHECKING: 1
                  SAVINGS: 1
                  CREDIT: 0
                  INVESTMENT: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/{accountId}:
    get:
      operationId: getAccount
      summary: Get an owned account by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Account not found or not owned
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Not Found
                status: 404
                detail: Account not found
    put:
      operationId: updateAccount
      summary: Update an owned account's type or status
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
            example:
              accountType: SAVINGS
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: closeAccount
      summary: Close an owned zero-balance account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Account closed or already closed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /accounts/{accountId}/status:
    patch:
      operationId: updateAccountStatus
      summary: Freeze, unfreeze, or close an owned account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
            example:
              status: FROZEN
      responses:
        '200':
          description: Account status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /accounts/{accountId}/balance:
    get:
      operationId: getAccountBalance
      summary: Get an owned account balance
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
              example:
                accountId: 1
                accountNumber: '123456789012'
                currency: USD
                balance: 100.0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Account not found or not owned
    put:
      operationId: updateAccountBalance
      summary: Replace an owned account balance
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceUpdateRequest'
            example:
              balance: 1500.0
      responses:
        '200':
          description: Balance updated
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Account not found or not owned
        '409':
          $ref: '#/components/responses/Conflict'
  /accounts/{accountId}/export-statement:
    post:
      operationId: exportAccountStatement
      summary: Export an owned account statement
      description: Returns the statement inline when no object store is configured, and an object key when it is.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Statement generated or exported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementExportResponse'
              examples:
                exported:
                  summary: Object store configured
                  value:
                    status: exported
                    key: statements/account-1/2026-01-01T00-00-00Z.json
                generated:
                  summary: No object store
                  value:
                    status: generated
                    statement:
                      accountId: 1
                      accountNumber: '123456789012'
                      accountType: SAVINGS
                      balance: 40.0
                      exportedAt: '2026-01-01T00:00:00'
                      userId: 7
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Statement export failed
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Type:
      name: type
      in: query
      schema:
        $ref: '#/components/schemas/AccountType'
    Status:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/AccountStatus'
    Query:
      name: q
      in: query
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: createdAt,desc
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
          example:
            status: 401
            error: Unauthorized
            message: Access denied. Please provide valid authentication credentials.
            path: /api/accounts
            timestamp: '2026-01-01T00:00:00'
    Problem:
      description: Request rejected
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: Invalid account type
    ValidationProblem:
      description: Request body failed validation, or the payload could not be read
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            accountType: Account type must be CHECKING, SAVINGS, CREDIT, or INVESTMENT
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Account not found or not owned
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: Account not found
    Conflict:
      description: Closed account, invalid transition, nonzero closing balance, or reserved movement
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            detail: Account balance must be zero
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AccountType:
      type: string
      enum: [CHECKING, SAVINGS, CREDIT, INVESTMENT]
    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, FROZEN, CLOSED]
    AccountStatusChange:
      type: string
      enum: [ACTIVE, FROZEN, CLOSED]
    Problem:
      type: object
      description: RFC 9457 problem detail returned for ResponseStatusException.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      example:
        title: Conflict
        status: 409
        detail: Account balance must be zero
    ValidationError:
      type: object
      description: Field name to validation message.
      additionalProperties:
        type: string
      example:
        accountType: Account type must be CHECKING, SAVINGS, CREDIT, or INVESTMENT
    Unauthorized:
      type: object
      required: [status, error, message, path, timestamp]
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
      example:
        status: 401
        error: Unauthorized
        message: Access denied. Please provide valid authentication credentials.
        path: /api/accounts
        timestamp: '2026-01-01T00:00:00'
    AccountList:
      type: array
      items:
        $ref: '#/components/schemas/AccountResponse'
    AccountPage:
      type: object
      required: [content, pageable, last, totalPages, totalElements, size, number, sort, first, numberOfElements, empty]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
        pageable:
          type: object
        sort:
          type: object
        last:
          type: boolean
        first:
          type: boolean
        empty:
          type: boolean
        totalPages:
          type: integer
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
        number:
          type: integer
        numberOfElements:
          type: integer
      example:
        content: []
        pageable: {}
        sort: {}
        last: true
        first: true
        empty: true
        totalPages: 0
        totalElements: 0
        size: 2
        number: 0
        numberOfElements: 0
    AccountSummary:
      type: object
      required: [totalAccounts, activeAccounts, totalBalance, accountsByType]
      properties:
        totalAccounts:
          type: integer
          format: int64
        activeAccounts:
          type: integer
          format: int64
        totalBalance:
          type: number
        accountsByType:
          type: object
          additionalProperties:
            type: integer
            format: int64
    AccountResponse:
      type: object
      required: [id, userId, accountNumber, balance, accountType, currency, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        accountNumber:
          type: string
        balance:
          type: number
        accountType:
          type: string
        currency:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AccountCreateRequest:
      type: object
      required: [accountType]
      properties:
        accountType:
          $ref: '#/components/schemas/AccountType'
        initialBalance:
          type: number
          minimum: 0
          default: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: USD
    AccountUpdateRequest:
      type: object
      properties:
        accountType:
          $ref: '#/components/schemas/AccountType'
        status:
          $ref: '#/components/schemas/AccountStatusChange'
    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AccountStatusChange'
    BalanceUpdateRequest:
      type: object
      required: [balance]
      properties:
        balance:
          type: number
    BalanceResponse:
      type: object
      required: [accountId, accountNumber, currency, balance]
      properties:
        accountId:
          type: integer
          format: int64
        accountNumber:
          type: string
        currency:
          type: string
        balance:
          type: number
    StatementDocument:
      type: object
      required: [accountId, accountNumber, accountType, balance, exportedAt, userId]
      properties:
        accountId:
          type: integer
          format: int64
        accountNumber:
          type: string
        accountType:
          type: string
        balance:
          type: number
        exportedAt:
          type: string
          format: date-time
        userId:
          type: integer
          format: int64
    StatementExportResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [generated, exported]
        key:
          type: string
        statement:
          $ref: '#/components/schemas/StatementDocument'
