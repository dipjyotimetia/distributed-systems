openapi: 3.0.3
info:
  title: Accounts Service
  description: API for managing bank accounts.
  version: 1.0.0
servers:
  - url: http://localhost:8082/api
    description: Local development server
paths:
  /accounts:
    get:
      summary: Get all accounts for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Account array or a page when page or size is supplied
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/AccountResponse'
                  - $ref: '#/components/schemas/AccountPage'
    post:
      summary: Create a new account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
  /accounts/search:
    get:
      summary: Search owned accounts by number or type
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Matching account page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
  /accounts/summary:
    get:
      summary: Summarize owned accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account counts and balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
  /accounts/{accountId}:
    get:
      summary: Get account by ID
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Account not found
    put:
      summary: Update an owned account's type or status
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountType:
                  type: string
                  enum: [CHECKING, SAVINGS, CREDIT, INVESTMENT]
                status:
                  type: string
                  enum: [ACTIVE, FROZEN, CLOSED]
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid account update
        '404':
          description: Account not found
        '409':
          description: Closed account, invalid transition, nonzero closing balance, or reserved movement
    delete:
      summary: Close an owned zero-balance account
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Account closed or already closed
        '404':
          description: Account not found
        '409':
          description: Account has a balance or reserved movement
  /accounts/{accountId}/status:
    patch:
      summary: Freeze, unfreeze, or close an owned account
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, FROZEN, CLOSED]
      responses:
        '200':
          description: Account status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Account not found
        '409':
          description: Invalid transition, nonzero closing balance, or reserved movement
  /accounts/{accountId}/balance:
    get:
      summary: Get account balance
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '404':
          description: Account not found
    put:
      summary: Update account balance
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - balance
              properties:
                balance:
                  type: number
      responses:
        '200':
          description: Balance updated successfully
        '404':
          description: Account not found

components:
  parameters:
    Type:
      name: type
      in: query
      schema:
        type: string
        enum: [CHECKING, SAVINGS, CREDIT, INVESTMENT]
    Status:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/AccountStatus'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: 'createdAt,desc'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, FROZEN, CLOSED]
    AccountPage:
      type: object
      required: [content, pageable, last, totalPages, totalElements, size, number, sort, first, numberOfElements, empty]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
        pageable:
          type: object
        sort:
          type: object
        last:
          type: boolean
        first:
          type: boolean
        empty:
          type: boolean
        totalPages:
          type: integer
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
        number:
          type: integer
        numberOfElements:
          type: integer
    AccountSummary:
      type: object
      properties:
        totalAccounts:
          type: integer
          format: int64
        activeAccounts:
          type: integer
          format: int64
        totalBalance:
          type: number
        accountsByType:
          type: object
          additionalProperties:
            type: integer
            format: int64
    AccountResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        accountNumber:
          type: string
        balance:
          type: number
        accountType:
          type: string
        currency:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
        updatedAt:
          type: string
    AccountCreateRequest:
      type: object
      required:
        - accountType
      properties:
        accountType:
          type: string
          enum: [CHECKING, SAVINGS, CREDIT, INVESTMENT]
        initialBalance:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: USD
    BalanceResponse:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
        currency:
          type: string
        balance:
          type: number
        accountNumber:
          type: string
