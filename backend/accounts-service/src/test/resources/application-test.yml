spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V4__Account_movement_reservations.sql,classpath:account-postings-h2.sql
  datasource:
    url: jdbc:h2:mem:${random.uuid};INIT=CREATE SCHEMA IF NOT EXISTS accounts_service
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  flyway:
    enabled: false

# JWT Configuration
jwt:
  secret: testSecretKey123456789012345678901234567890
  expiration: 86400000

logging:
  level:
    com.banking.accountsservice: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG