apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-kafka
  namespace: banking-app
  labels:
    app.kubernetes.io/name: banking-app
    app.kubernetes.io/component: messaging
    app.kubernetes.io/service: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-kafka
      app.kubernetes.io/name: banking-app
      app.kubernetes.io/component: messaging
  template:
    metadata:
      labels:
        app: banking-kafka
        app.kubernetes.io/name: banking-app
        app.kubernetes.io/component: messaging
        app.kubernetes.io/service: kafka
    spec:
      serviceAccountName: banking-app-sa
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
        ports:
        - containerPort: 9092
          name: plaintext
        - containerPort: 8081
          name: schema-reg
        args:
        - redpanda
        - start
        - --mode=dev-container
        - --smp=1
        - --kafka-addr=0.0.0.0:9092
        - --advertise-kafka-addr=banking-kafka:9092
        - --schema-registry-addr=0.0.0.0:8081
        - --set
        - redpanda.auto_create_topics_enabled=true
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "300m"
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 6
