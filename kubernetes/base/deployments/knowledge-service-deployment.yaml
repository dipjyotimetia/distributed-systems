apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-knowledge
  namespace: banking-app
  labels:
    app.kubernetes.io/name: banking-app
    app.kubernetes.io/component: microservice
    app.kubernetes.io/service: knowledge-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-knowledge
      app.kubernetes.io/name: banking-app
      app.kubernetes.io/component: microservice
  template:
    metadata:
      labels:
        app: banking-knowledge
        app.kubernetes.io/name: banking-app
        app.kubernetes.io/component: microservice
        app.kubernetes.io/service: knowledge-service
    spec:
      serviceAccountName: banking-app-sa
      containers:
      - name: knowledge-service
        image: ghcr.io/dipjyotimetia/distributed-systems/knowledge-service:v1.4.140
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: banking-knowledge-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: banking-jwt-secret
              key: secret
        - name: KNOWLEDGE_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: banking-knowledge-secret
              key: internal-token
              optional: true
        volumeMounts:
        - name: blobs
          mountPath: /data/knowledge-blobs
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: blobs
        persistentVolumeClaim:
          claimName: banking-knowledge-blobs-pvc
