apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - provider-fixtures.yaml

images:
  - name: ghcr.io/dipjyotimetia/distributed-systems/frontend
    newName: microsvc-journeys/frontend
    newTag: checkout
  - name: ghcr.io/dipjyotimetia/distributed-systems/api-gateway
    newName: microsvc-journeys/api-gateway
    newTag: checkout
  - name: ghcr.io/dipjyotimetia/distributed-systems/accounts-service
    newName: microsvc-journeys/accounts-service
    newTag: checkout
  - name: ghcr.io/dipjyotimetia/distributed-systems/user-service
    newName: microsvc-journeys/user-service
    newTag: checkout
  - name: ghcr.io/dipjyotimetia/distributed-systems/transactions-service
    newName: microsvc-journeys/transactions-service
    newTag: checkout
  - name: ghcr.io/dipjyotimetia/distributed-systems/fraud-service
    newName: microsvc-journeys/fraud-service
    newTag: checkout
  - name: ghcr.io/dipjyotimetia/distributed-systems/notification-service
    newName: microsvc-journeys/notification-service
    newTag: checkout
  - name: ghcr.io/dipjyotimetia/distributed-systems/ai-service
    newName: microsvc-journeys/ai-service
    newTag: checkout
  - name: ghcr.io/dipjyotimetia/distributed-systems/disputes-service
    newName: microsvc-journeys/disputes-service
    newTag: checkout

patches:
  - target:
      kind: Deployment
      name: banking-(frontend|gateway|accounts|user|transactions|fraud|notification|ai|statement-worker|disputes|disputes-worker)
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: banking-sim
        namespace: banking-app
      $patch: delete
  - patch: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: seed-user-pool
        namespace: banking-app
      $patch: delete
  - patch: |
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: simulation-client-hpa
        namespace: banking-app
      $patch: delete
  - target:
      kind: Deployment
      name: banking-transactions
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PAYMENT_COMPLY_BASE_URL
          value: "http://provider-fixtures:8081"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PAYMENT_STRIPE_URL
          value: "http://provider-fixtures:8081/v1/payment_intents"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PAYMENT_PAYPAL_URL
          value: "http://provider-fixtures:8081/v2/checkout/orders"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: FRAUD_TRANSFER_MERCHANT_CATEGORY
          value: "5812"
  - target:
      kind: Deployment
      name: banking-fraud
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIPE_RADAR_URL
          value: "http://provider-fixtures:8081/radar"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SIFT_EVENTS_URL
          value: "http://provider-fixtures:8081/sift"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MAXMIND_SCORE_URL
          value: "http://provider-fixtures:8081/maxmind"
  - target:
      kind: Deployment
      name: banking-notification
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SLACK_WEBHOOK_URL
          value: "http://provider-fixtures:8081/slack"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SENDGRID_API_URL
          value: "http://provider-fixtures:8081/v3/mail/send"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TWILIO_API_BASE_URL
          value: "http://provider-fixtures:8081"
