apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: observability
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}
      # Drop actuator probe/scrape spans and noisy Spring Security internal
      # spans. Uses OTTL `traces.span` conditions, which are OR-ed: a span is
      # dropped if ANY condition is true. (The previous MatchProperties form
      # AND-ed span_names with the attribute list, so it matched nothing and
      # actuator traces leaked through to Jaeger.)
      filter:
        error_mode: ignore
        traces:
          span:
            # Actuator health/liveness/readiness/prometheus probes — match on
            # span name (e.g. "http get /actuator/health") and on whichever
            # URL attribute the instrumentation emits.
            - 'IsMatch(name, "(?i)actuator")'
            - 'IsMatch(attributes["http.url"], "/actuator")'
            - 'IsMatch(attributes["http.target"], "/actuator")'
            - 'IsMatch(attributes["url.path"], "/actuator")'
            - 'IsMatch(attributes["http.route"], "/actuator")'
            # Noisy Spring Security internal spans.
            - 'name == "security filterchain before"'
            - 'name == "security filterchain after"'
            - 'name == "authorize exchange"'
            - 'name == "secured request"'

    exporters:
      otlp:
        endpoint: "jaeger:4317"
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki:3100/otlp
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [filter]
          exporters: [otlp]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/loki, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app: opentelemetry
    component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentelemetry
      component: otel-collector
  template:
    metadata:
      labels:
        app: opentelemetry
        component: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.165.0
          args:
            - --config=/conf/otel-collector-config.yaml
          volumeMounts:
            - name: otel-collector-config-vol
              mountPath: /conf
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: otel-collector-config-vol
          configMap:
            name: otel-collector-conf
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    component: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
