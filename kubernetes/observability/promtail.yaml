apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
data:
  config.alloy: |
    loki.process "banking_app" {
      forward_to = [loki.write.default.receiver]

      stage.cri { }

      stage.regex {
        expression = "/var/log/pods/[^_]+_(?P<pod>.+)_[^_/]+/(?P<container>[^/]+)/[^/]+\\.log"
        source     = "filename"
      }

      stage.labels {
        values = {
          container = null,
          pod       = null,
        }
      }

      stage.drop {
        source     = "container"
        expression = "simulation-client|provider-fixtures|wait-for-.*|istio-.*"
      }

      stage.match {
        selector = "{namespace=\"banking-app\"}"

        stage.drop {
          drop_counter_reason = "debug_trace_volume"
          expression          = "(?i)\\s(DEBUG|TRACE)\\s"
        }
      }
    }

    loki.source.file "banking_app" {
      targets = [{
        __address__ = "localhost",
        __path__    = "/var/log/pods/banking-app_*/*/*.log",
        namespace   = "banking-app",
      }]
      forward_to = [loki.process.banking_app.receiver]

      file_match {
        enabled = true
      }
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: observability
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/alloy:v1.22.0
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:3101
            - --storage.path=/var/lib/alloy
            - /etc/alloy/config.alloy
          ports:
            - containerPort: 3101
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: positions
              mountPath: /var/lib/alloy
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: observability
