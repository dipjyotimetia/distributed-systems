apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banking-settlement-ingress
spec:
  podSelector:
    matchLabels:
      banking/settlement: "true"
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banking-payments-from-gateway
spec:
  podSelector:
    matchLabels:
      app: banking-payments
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: banking-gateway
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banking-payments-from-prometheus
spec:
  podSelector:
    matchLabels:
      app: banking-payments
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
