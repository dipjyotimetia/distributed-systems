apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-payments
spec:
  selector:
    matchLabels:
      app: banking-payments
  template:
    metadata:
      labels:
        app: banking-payments
        banking/settlement: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: payments
          image: ghcr.io/dipjyotimetia/distributed-systems/payments-service:v1.4.139
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: banking-payments-db
            - configMapRef:
                name: banking-payments-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: banking-jwt-secret
                  key: secret
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 768Mi
---
