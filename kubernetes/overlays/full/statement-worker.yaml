apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-statement-worker
spec:
  selector:
    matchLabels:
      app: banking-statement-worker
  template:
    metadata:
      labels:
        app: banking-statement-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: statement-worker
          image: ghcr.io/dipjyotimetia/distributed-systems/accounts-service:v1.4.139
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-config
            - configMapRef:
                name: banking-accounts-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker,statement-worker
            - name: SPRING_MAIN_LAZY_INITIALIZATION
              value: "false"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-db-credentials
                  key: accounts-service-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: banking-jwt-secret
                  key: secret
            - name: TEMPORAL_ADDRESS
              value: banking-temporal:7233
            - name: OTEL_SERVICE_NAME
              value: statement-worker
            - name: LEDGER_GRPC_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1Gi
