apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-kafka
  namespace: banking-app
spec:
  template:
    spec:
      containers:
      - name: redpanda
        args:
        - redpanda
        - start
        - --mode=dev-container
        - --smp=1
        - --kafka-addr=0.0.0.0:9092
        - --advertise-kafka-addr=banking-kafka:9092
        - --set
        - redpanda.auto_create_topics_enabled=true
        - --set
        - redpanda.enable_sasl=true
        - --set
        - 'redpanda.sasl_mechanisms=["SCRAM","PLAIN"]'
        - --set
        - 'redpanda.superusers=["$(BOOTSTRAP_USERNAME)"]'
        env:
        - name: BOOTSTRAP_USERNAME
          valueFrom:
            secretKeyRef:
              name: banking-kafka-sasl
              key: username
        - name: BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: banking-kafka-sasl
              key: password
        - name: RP_BOOTSTRAP_USER
          value: "$(BOOTSTRAP_USERNAME):$(BOOTSTRAP_PASSWORD):SCRAM-SHA-256"
