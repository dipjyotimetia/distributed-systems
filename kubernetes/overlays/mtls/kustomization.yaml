apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking-app

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: banking-kyc
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: MTLS_ENABLED, value: "true"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: MTLS_CA, value: /certs/ca.crt}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: MTLS_CERT, value: /certs/kyc-service.crt}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: MTLS_KEY, value: /certs/kyc-service.key}
      - op: add
        path: /spec/template/spec/volumes
        value: [{name: dev-certs, secret: {secretName: banking-dev-certs}}]
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{name: dev-certs, mountPath: /certs, readOnly: true}]
