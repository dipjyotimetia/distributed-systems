apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking-app

resources:
  - ../payments-shared
  - ../../../config/artemis
  - mq.yaml
  - postgres.yaml

patches:
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: banking-payments-config
      data:
        MQ_ADDRESS: tcp://banking-clearing-mq:61616
        MQ_USERNAME: app
        SPRING_FLYWAY_CREATE_SCHEMAS: "true"
