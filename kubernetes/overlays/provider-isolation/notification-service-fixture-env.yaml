apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-notification
  namespace: banking-app
spec:
  template:
    spec:
      containers:
      - name: notification-service
        env:
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: banking-thirdparty-keys
              key: SENDGRID_API_KEY
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: banking-thirdparty-keys
              key: TWILIO_ACCOUNT_SID
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: banking-thirdparty-keys
              key: TWILIO_AUTH_TOKEN
        - name: SLACK_WEBHOOK_URL
          value: "http://provider-fixtures:8081/slack"
        - name: SENDGRID_API_URL
          value: "http://provider-fixtures:8081/v3/mail/send"
        - name: TWILIO_API_BASE_URL
          value: "http://provider-fixtures:8081"
