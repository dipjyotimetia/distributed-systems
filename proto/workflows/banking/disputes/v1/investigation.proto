syntax = "proto3";

package banking.disputes.v1;

option go_package = "github.com/speedscale/microsvc/disputes-service/internal/generated/disputes/v1;disputesv1";

message CaseRevision {
  int64 case_id = 1;
  int64 revision = 2;
}

message InvestigationState {
  bool resolved = 1;
  int64 next_deadline_epoch_millis = 2;
}
