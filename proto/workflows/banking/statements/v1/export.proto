syntax = "proto3";

package banking.statements.v1;

option java_multiple_files = true;
option java_package = "com.banking.accountsservice.statements.generated.v1";

message StatementJob {
  string job_id = 1;
}

message StatementGeneration {
  int64 expires_at_epoch_millis = 1;
}

message StatementExpiry {
  bool complete = 1;
}
