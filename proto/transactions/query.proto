syntax = "proto3";

package transactions.v1;

option java_package = "transactions.v1";
option java_multiple_files = true;
option go_package = "github.com/dipjyotimetia/distributed-systems/backend/disputes-service/gen/transactions/v1;transactionsv1";

// Internal read used by disputes. The caller JWT is authorization metadata.
// The public GET /api/transactions/{id} stays for browsers and the AI tool.
service TransactionQuery {
  rpc GetTransaction(GetTransactionRequest) returns (TransactionView);
}

message GetTransactionRequest {
  int64 id = 1;
}

message TransactionView {
  int64 id = 1;
  int64 user_id = 2;
  string type = 3;
  string status = 4;
}
