services:
  # Database
  postgres:
    image: postgres:19.0-alpine
    container_name: banking-postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "banking_app"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      POSTGRES_DB: banking_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_19:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - banking-network

  mongodb:
    image: mongo:9.0.8
    volumes:
      - mongodb_data:/data/db
    networks: [banking-network]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20

  notification-service:
    build: ./backend/notification-service
    restart: on-failure
    networks: [banking-network]
    depends_on:
      redpanda:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      MONGO_URI: mongodb://mongodb:27017
      JWT_SECRET: banking-app-super-secret-key-change-this-in-production-256-bit
      OTEL_SERVICE_NAME: notification-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_PROPAGATORS: tracecontext
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=banking-app

  # Backend Services
  disputes-schema:
    image: postgres:19.0-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "banking_app", "-v", "disputes_password=disputes_service_pass", "-f", "/migrations/bootstrap.sql"]
    volumes:
      - ./kubernetes/overlays/full:/migrations:ro
    networks:
      - banking-network

  disputes-service:
    build: ./backend/disputes-service
    depends_on:
      disputes-schema:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      DATABASE_URL: postgres://disputes_service_user:disputes_service_pass@postgres:5432/banking_app?sslmode=disable
      JWT_SECRET: banking-app-super-secret-key-change-this-in-production-256-bit
      TRANSACTIONS_GRPC_ADDRESS: transactions-service:9095
      DISPUTES_GRPC_PORT: "9096"
      DISPUTES_OPERATOR_IDS: ${DISPUTES_OPERATOR_IDS:-}
      DISPUTES_INTERNAL_TOKEN: local-disputes-internal
      OTEL_SERVICE_NAME: disputes-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD", "disputes-service", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - banking-network

  disputes-worker:
    build: ./backend/disputes-service
    depends_on:
      disputes-service:
        condition: service_healthy
      disputes-temporal:
        condition: service_healthy
    restart: on-failure
    environment:
      DISPUTES_MODE: worker
      DATABASE_URL: postgres://disputes_service_user:disputes_service_pass@postgres:5432/banking_app?sslmode=disable
      TEMPORAL_ADDRESS: disputes-temporal:7233
      OTEL_SERVICE_NAME: disputes-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD", "disputes-service", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - banking-network

  disputes-temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/disputes.db", "--headless"]
    volumes:
      - disputes_temporal_data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - banking-network

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: banking-user-service
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=banking_app
      - DB_USERNAME=user_service_user
      - DB_PASSWORD=user_service_pass
      - DB_SCHEMA=user_service
      # JWT Configuration
      - JWT_SECRET=banking-app-super-secret-key-change-this-in-production-256-bit
      - JWT_EXPIRATION=86400000
      # OpenTelemetry Configuration
      - OTEL_SERVICE_NAME=user-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_SAMPLER=always_on
      - OTEL_PROPAGATORS=tracecontext
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=banking-app
    ports:
      - "8081:8080"
    networks:
      - banking-network

  accounts-service:
    build:
      context: .
      dockerfile: backend/accounts-service/Dockerfile
    container_name: banking-accounts-service
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=banking_app
      - DB_USERNAME=accounts_service_user
      - DB_PASSWORD=accounts_service_pass
      - DB_SCHEMA=accounts_service
      # JWT Configuration
      - JWT_SECRET=banking-app-super-secret-key-change-this-in-production-256-bit
      - JWT_EXPIRATION=86400000
      # OpenTelemetry Configuration
      - OTEL_SERVICE_NAME=accounts-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_SAMPLER=always_on
      - OTEL_PROPAGATORS=tracecontext
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=banking-app
    ports:
      - "8082:8080"
    networks:
      - banking-network

  statement-worker:
    build:
      context: .
      dockerfile: backend/accounts-service/Dockerfile
    depends_on:
      accounts-service:
        condition: service_started
      disputes-temporal:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: docker,statement-worker
      SPRING_MAIN_LAZY_INITIALIZATION: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: banking_app
      TEMPORAL_ADDRESS: disputes-temporal:7233
      OTEL_SERVICE_NAME: statement-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=banking-app
      LEDGER_GRPC_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    networks:
      - banking-network

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    networks: [banking-network]
    ports:
      - "8081:8081"
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
      - --schema-registry-addr=0.0.0.0:8081
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          (rpk topic describe transaction-events -X brokers=redpanda:9092 >/dev/null 2>&1 ||
           rpk topic create transaction-events --partitions 1 --replicas 1 -X brokers=redpanda:9092) &&
          (rpk topic describe movement-lifecycle-v1 -X brokers=redpanda:9092 >/dev/null 2>&1 ||
           rpk topic create movement-lifecycle-v1 --partitions 1 --replicas 1 -X brokers=redpanda:9092) &&
          rpk registry mode get -X registry.hosts=127.0.0.1:8081 >/dev/null
      interval: 5s
      timeout: 10s
      retries: 15

  transactions-service:
    build:
      context: .
      dockerfile: backend/transactions-service/Dockerfile
    container_name: banking-transactions-service
    depends_on:
      postgres:
        condition: service_started
      fraud-service:
        condition: service_started
      redpanda:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=banking_app
      - DB_USERNAME=transactions_service_user
      - DB_PASSWORD=transactions_service_pass
      - DB_SCHEMA=transactions_service
      # JWT Configuration
      - JWT_SECRET=banking-app-super-secret-key-change-this-in-production-256-bit
      - JWT_EXPIRATION=86400000
      # Service URLs
      - ACCOUNTS_GRPC_ADDRESS=accounts-service:9092
      - TRANSACTIONS_GRPC_PORT=9095
      - FRAUD_SERVICE_HOST=fraud-service
      - FRAUD_SERVICE_PORT=8080
      - FRAUD_FAIL_OPEN=${FRAUD_FAIL_OPEN:-true}
      - KAFKA_BROKERS=redpanda:9092
      - SCHEMA_REGISTRY_URL=http://redpanda:8081
      - KAFKA_VALUE_FORMAT=avro
      # OpenTelemetry Configuration
      - OTEL_SERVICE_NAME=transactions-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_SAMPLER=always_on
      - OTEL_PROPAGATORS=tracecontext
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=banking-app
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "8083:8080"
      - "5005:5005"
    networks:
      - banking-network

  # Fraud detection (gRPC) — transactions-service calls this for every transaction.
  # Without it the fraud gRPC call fails and the client fails open (no fraud checks).
  fraud-service:
    build:
      context: ./backend/fraud-service
      dockerfile: Dockerfile
    container_name: banking-fraud-service
    environment:
      - GRPC_PORT=8080
      - METRICS_PORT=9091
      - OTEL_SERVICE_NAME=fraud-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_PROPAGATORS=tracecontext
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=banking-app
    ports:
      - "8086:8080"
    networks:
      - banking-network

  # Redis for rate limiting
  redis:
    image: redis:8.10.3-alpine
    container_name: banking-redis
    ports:
      - "6379:6379"
    networks:
      - banking-network

  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    container_name: banking-api-gateway
    depends_on:
      - user-service
      - accounts-service
      - transactions-service
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - USER_SERVICE_URL=http://user-service:8080
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8080
      - TRANSACTIONS_SERVICE_URL=http://transactions-service:8080
      - DISPUTES_SERVICE_URL=http://disputes-service:8080
      - KNOWLEDGE_SERVICE_URL=http://knowledge-service:8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FAULT_INJECTION_RATE=${FAULT_INJECTION_RATE:-0}
      # JWT Configuration
      - JWT_SECRET=banking-app-super-secret-key-change-this-in-production-256-bit
      - JWT_EXPIRATION=86400000
      # OpenTelemetry Configuration
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_SAMPLER=always_on
      - OTEL_PROPAGATORS=tracecontext
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=banking-app
      - OTEL_EXPORTER_OTLP_TIMEOUT=10000
      - OTEL_EXPORTER_OTLP_COMPRESSION=none
    ports:
      - "8080:8080"
    networks:
      - banking-network

  kyc-service:
    build: ./backend/kyc-service
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/banking_app?sslmode=disable
      JWT_SECRET: banking-app-super-secret-key-change-this-in-production-256-bit
      TEMPORAL_ADDRESS: disputes-temporal:7233
      KYC_OPERATOR_IDS: ${KYC_OPERATOR_IDS:-}
      GRPC_PORT: "8091"
      METRICS_PORT: "9092"
      OTEL_SERVICE_NAME: kyc-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=banking-app
    depends_on:
      postgres:
        condition: service_healthy
      disputes-temporal:
        condition: service_healthy
    ports: ["8091:8091"]
    networks: [banking-network]

  kyc-worker:
    build: ./backend/kyc-service
    environment:
      KYC_MODE: worker
      DATABASE_URL: postgres://postgres:password@postgres:5432/banking_app?sslmode=disable
      TEMPORAL_ADDRESS: disputes-temporal:7233
      OTEL_SERVICE_NAME: kyc-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=banking-app
    depends_on:
      kyc-service:
        condition: service_started
      disputes-temporal:
        condition: service_healthy
    networks: [banking-network]

  cards-service:
    build:
      context: ./backend
      dockerfile: cards-service/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/banking_app?sslmode=disable
      JWT_SECRET: banking-app-super-secret-key-change-this-in-production-256-bit
      MOVEMENT_SECRET: banking-app-super-secret-key-change-this-in-production-256-bit
      ACCOUNTS_GRPC_ADDRESS: accounts-service:9092
      KYC_GRPC_ADDR: kyc-service:8091
      FRAUD_GRPC_ADDR: fraud-service:8080
      GRPC_PORT: "8092"
      METRICS_PORT: "9093"
      OTEL_SERVICE_NAME: cards-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=banking-app
    depends_on:
      postgres:
        condition: service_healthy
      kyc-service:
        condition: service_started
      fraud-service:
        condition: service_started
      accounts-service:
        condition: service_started
    ports: ["8092:8092"]
    networks: [banking-network]

  # S3-compatible object store for knowledge-service blobs (MinIO Docker Hub pulls are blocked).
  # https://github.com/rustfs/rustfs — Apache-2.0, path-style S3 on :9000, console on :9001.
  rustfs-volume-init:
    image: alpine:3.22
    volumes:
      - rustfs_data:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    networks:
      - banking-network

  rustfs:
    image: rustfs/rustfs:1.0.5
    container_name: banking-rustfs
    depends_on:
      rustfs-volume-init:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_REGION: us-east-1
      RUSTFS_CHECK_UPDATE: "false"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - banking-network

  knowledge-schema:
    image: postgres:19.0-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "banking_app", "-v", "knowledge_password=knowledge_service_pass", "-f", "/migrations/bootstrap.sql"]
    volumes:
      - ./backend/knowledge-service/migrations:/migrations:ro
    networks:
      - banking-network

  knowledge-service:
    build: ./backend/knowledge-service
    container_name: banking-knowledge
    depends_on:
      knowledge-schema:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://knowledge_service_user:knowledge_service_pass@postgres:5432/banking_app?sslmode=disable
      - KNOWLEDGE_STORE=postgres
      - STORAGE_BACKEND=s3
      - AWS_S3_BUCKET=knowledge
      - AWS_S3_ENDPOINT_URL=http://rustfs:9000
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - AWS_REGION=us-east-1
      - JWT_SECRET=banking-app-super-secret-key-change-this-in-production-256-bit
      - KNOWLEDGE_INTERNAL_TOKEN=local-knowledge-internal
      - OTEL_SERVICE_NAME=knowledge-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=banking-app
    ports:
      - "8093:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - banking-network

  ai-service:
    build: ./backend/ai-service
    container_name: banking-ai
    depends_on:
      disputes-temporal:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
    environment:
      - AI_PROVIDER_MODE=fixture
      - AI_MODE=api
      - TEMPORAL_ADDRESS=disputes-temporal:7233
      - DISPUTES_SERVICE_URL=http://disputes-service:8080
      - DISPUTES_GRPC_ADDRESS=disputes-service:9096
      - DISPUTES_INTERNAL_TOKEN=local-disputes-internal
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8080
      - TRANSACTIONS_SERVICE_URL=http://transactions-service:8080
      - KNOWLEDGE_SERVICE_URL=http://knowledge-service:8080
      - KNOWLEDGE_INTERNAL_TOKEN=local-knowledge-internal
      - CLAIM_CHECK_DIR=/tmp/ai-claim-check
      - OTEL_SERVICE_NAME=ai-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=banking-app
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - banking-network

  ai-worker:
    build: ./backend/ai-service
    container_name: banking-ai-worker
    depends_on:
      ai-service:
        condition: service_healthy
      disputes-temporal:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
    environment:
      - AI_PROVIDER_MODE=fixture
      - AI_MODE=worker
      - TEMPORAL_ADDRESS=disputes-temporal:7233
      - DISPUTES_SERVICE_URL=http://disputes-service:8080
      - DISPUTES_GRPC_ADDRESS=disputes-service:9096
      - DISPUTES_INTERNAL_TOKEN=local-disputes-internal
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8080
      - TRANSACTIONS_SERVICE_URL=http://transactions-service:8080
      - KNOWLEDGE_SERVICE_URL=http://knowledge-service:8080
      - KNOWLEDGE_INTERNAL_TOKEN=local-knowledge-internal
      - CLAIM_CHECK_DIR=/tmp/ai-claim-check
      - OTEL_SERVICE_NAME=ai-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=banking-app
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - banking-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banking-frontend
    depends_on:
      api-gateway:
        condition: service_started
      ai-service:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - API_GATEWAY_URL=http://api-gateway:8080
      - AI_SERVICE_URL=http://ai-service:8080
      - KNOWLEDGE_SERVICE_URL=http://knowledge-service:8080
      - NOTIFICATION_SERVICE_URL=http://notification-service:8080
      - KYC_GRPC_ADDR=kyc-service:8091
      - CARDS_GRPC_ADDR=cards-service:8092
      - NODE_ENV=development
      # OpenTelemetry Configuration
      - OTEL_SERVICE_NAME=frontend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_SAMPLER=always_on
      - OTEL_PROPAGATORS=tracecontext
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=banking-app
      # Debug logging for OpenTelemetry
      - OTEL_LOG_LEVEL=DEBUG
      - OTEL_TRACES_SAMPLER_ARG=1.0
      - OTEL_EXPORTER_OTLP_TIMEOUT=10000
      - OTEL_EXPORTER_OTLP_COMPRESSION=none
      # Node.js debug logging
      - DEBUG=*
      - NODE_OPTIONS=--trace-warnings
    ports:
      - "3000:3000"
    networks:
      - banking-network

  # Observability Stack
  # Collector applies the same actuator/Spring Security span filters as
  # kubernetes/observability/otel-collector.yaml, then forwards to Jaeger.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: banking-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      - jaeger
    networks:
      - banking-network

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    container_name: banking-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - banking-network

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: banking-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/money-movement-alerts.yml:/etc/prometheus/money-movement-alerts.yml:ro
    networks:
      - banking-network

  grafana:
    image: grafana/grafana:13.3.1
    container_name: banking-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - banking-network

volumes:
  postgres_data_19:
  disputes_temporal_data:
  grafana_data:
  mongodb_data:
  rustfs_data:

networks:
  banking-network:
    driver: bridge
