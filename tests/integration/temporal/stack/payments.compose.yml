services:
  user-service:
    environment:
      SIM_USER_COUNT: "0"
      JWT_SECRET: ${BANKING_PAYMENTS_JWT_SECRET:?}
  accounts-service:
    environment:
      JWT_SECRET: ${BANKING_PAYMENTS_JWT_SECRET:?}
  transactions-service:
    environment:
      JWT_SECRET: ${BANKING_PAYMENTS_JWT_SECRET:?}
  api-gateway:
    environment:
      JWT_SECRET: ${BANKING_PAYMENTS_JWT_SECRET:?}
      FAULT_INJECTION_RATE: "0"
  clearing-simulator:
    environment:
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      CLEARING_EXPORT_INTERVAL: "3000"
  payments-reconciliation:
    environment:
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  clearing-mq:
    networks:
      banking-network: {}
      test-edge:
        gw_priority: 1
    ports:
      - "127.0.0.1::61616"
  redpanda:
    tmpfs: !reset []
  jaeger:
    container_name: !reset null
    ports: !override
      - "127.0.0.1::16686"
    networks: !override
      banking-network: {}
      test-edge:
        gw_priority: 1
  otel-collector:
    container_name: !reset null
    ports: !override
      - "127.0.0.1::4317"
      - "127.0.0.1::4318"
      - "127.0.0.1::13133"
    networks: !override
      banking-network: {}
      test-edge:
        gw_priority: 1
