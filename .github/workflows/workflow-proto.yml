name: Workflow Protobuf
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: backend/disputes-service/go.mod
          cache: false
      - name: Install pinned local tools
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          case "$(uname -m)" in
            aarch64|arm64) arch=aarch_64 ;;
            *) arch=x86_64 ;;
          esac
          protoc_dest="$(go env GOPATH)/bin/protoc"
          urls=(
            "https://repo1.maven.org/maven2/com/google/protobuf/protoc/4.36.2/protoc-4.36.2-linux-${arch}.exe"
            "https://repo.maven.apache.org/maven2/com/google/protobuf/protoc/4.36.2/protoc-4.36.2-linux-${arch}.exe"
          )
          downloaded=0
          for attempt in 1 2 3; do
            for url in "${urls[@]}"; do
              if curl -fsSL --retry 2 --retry-all-errors "$url" -o "$protoc_dest"; then
                downloaded=1
                break 2
              fi
              echo "protoc download failed: $url" >&2
            done
            sleep "$attempt"
          done
          if [ "$downloaded" -ne 1 ]; then
            zip="$(mktemp)"
            gh_url="https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-${arch}.zip"
            curl -fsSL --retry 3 --retry-all-errors "$gh_url" -o "$zip"
            unzip -p "$zip" bin/protoc > "$protoc_dest"
            rm -f "$zip"
          fi
          chmod +x "$protoc_dest"
          go env GOPATH | sed 's|$|/bin|' >> "$GITHUB_PATH"
      - name: Verify generated bindings
        run: |
          generated="$(mktemp -d)"
          bash scripts/workflow-proto.sh "$generated"
          go_bindings=backend/disputes-service/internal/generated
          java_bindings=backend/accounts-service/src/main/java/com/banking/accountsservice/statements/generated
          diff -ru "$go_bindings" "$generated/$go_bindings"
          diff -ru "$java_bindings" "$generated/$java_bindings"
      - name: Verify fraud gRPC bindings
        run: |
          generated="$(mktemp -d)"
          module=github.com/dipjyotimetia/distributed-systems/backend/fraud-service
          protoc -I contracts/proto/fraud \
            --go_out="$generated" --go_opt=module="$module" \
            --go-grpc_out="$generated" --go-grpc_opt=module="$module" \
            contracts/proto/fraud/fraud.proto
          diff -ru backend/fraud-service/gen "$generated/gen"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend protobuf plugin
        working-directory: frontend
        run: npm ci
      - name: Verify internal gRPC and OpenAPI server stubs
        run: |
          python3 -m pip install --user 'grpcio-tools==1.83.2'
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.0
          bash scripts/check-contract-drift.sh
      - name: Verify frontend gRPC clients
        run: |
          generated="$(mktemp -d)"
          bash scripts/frontend-proto.sh "$generated"
          diff -ru frontend/src/gen/kyc "$generated/frontend/src/gen/kyc"
          diff -ru frontend/src/gen/cards "$generated/frontend/src/gen/cards"
      - name: Check compatibility with PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:contracts/proto/workflows/buf.yaml"; then
            git archive "$BASE_SHA" contracts/proto/workflows | tar -x -C "$RUNNER_TEMP"
            buf breaking contracts/proto/workflows --against "$RUNNER_TEMP/contracts/proto/workflows"
          elif git cat-file -e "${BASE_SHA}:proto/workflows/buf.yaml"; then
            git archive "$BASE_SHA" proto/workflows | tar -x -C "$RUNNER_TEMP"
            buf breaking contracts/proto/workflows --against "$RUNNER_TEMP/proto/workflows"
          fi
