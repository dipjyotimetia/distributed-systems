name: Workflow Protobuf
on:
  pull_request:
    paths:
      - '.github/workflows/workflow-proto.yml'
      - 'contracts/**'
      - 'scripts/workflow-proto.sh'
      - 'scripts/frontend-proto.sh'
      - 'scripts/check-contract-drift.sh'
      - 'scripts/check-movement-contract.py'
      - 'scripts/generate-openapi-*.sh'
      - 'backend/disputes-service/internal/generated/**'
      - 'backend/disputes-service/gen/**'
      - 'backend/accounts-service/src/main/java/com/banking/accountsservice/statements/generated/**'
      - 'backend/fraud-service/gen/**'
      - 'backend/cards-service/gen/**'
      - 'backend/ai-service/gen/**'
      - 'backend/notification-service/internal/api/openapi.gen.go'
      - 'backend/disputes-service/internal/httpapi/openapi.gen.go'
      - 'frontend/src/gen/**'
      - 'frontend/package-lock.json'
      - 'tests/integration/temporal/openapi/**'
  push:
    branches: [master, develop]
    paths:
      - '.github/workflows/workflow-proto.yml'
      - 'contracts/**'
      - 'scripts/workflow-proto.sh'
      - 'scripts/frontend-proto.sh'
      - 'scripts/check-contract-drift.sh'
      - 'scripts/check-movement-contract.py'
      - 'scripts/generate-openapi-*.sh'
      - 'backend/disputes-service/internal/generated/**'
      - 'backend/disputes-service/gen/**'
      - 'backend/accounts-service/src/main/java/com/banking/accountsservice/statements/generated/**'
      - 'backend/fraud-service/gen/**'
      - 'backend/cards-service/gen/**'
      - 'backend/ai-service/gen/**'
      - 'backend/notification-service/internal/api/openapi.gen.go'
      - 'backend/disputes-service/internal/httpapi/openapi.gen.go'
      - 'frontend/src/gen/**'
      - 'frontend/package-lock.json'
      - 'tests/integration/temporal/openapi/**'

concurrency:
  group: workflow-proto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: backend/disputes-service/go.mod
          cache: true
          cache-dependency-path: |
            backend/disputes-service/go.sum
            backend/fraud-service/go.sum
            backend/cards-service/go.sum
            backend/notification-service/go.sum
      - name: Install pinned local tools
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          case "$(uname -m)" in
            aarch64|arm64) arch=aarch_64 ;;
            *) arch=x86_64 ;;
          esac
          protoc_dest="$(go env GOPATH)/bin/protoc"
          urls=(
            "https://repo1.maven.org/maven2/com/google/protobuf/protoc/4.36.2/protoc-4.36.2-linux-${arch}.exe"
            "https://repo.maven.apache.org/maven2/com/google/protobuf/protoc/4.36.2/protoc-4.36.2-linux-${arch}.exe"
          )
          downloaded=0
          for attempt in 1 2 3; do
            for url in "${urls[@]}"; do
              if curl -fsSL --retry 2 --retry-all-errors "$url" -o "$protoc_dest"; then
                downloaded=1
                break 2
              fi
              echo "protoc download failed: $url" >&2
            done
            sleep "$attempt"
          done
          if [ "$downloaded" -ne 1 ]; then
            zip="$(mktemp)"
            gh_url="https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-${arch}.zip"
            curl -fsSL --retry 3 --retry-all-errors "$gh_url" -o "$zip"
            unzip -p "$zip" bin/protoc > "$protoc_dest"
            rm -f "$zip"
          fi
          chmod +x "$protoc_dest"
          go env GOPATH | sed 's|$|/bin|' >> "$GITHUB_PATH"
      - name: Verify generated bindings
        run: |
          generated="$(mktemp -d)"
          bash scripts/workflow-proto.sh "$generated"
          go_bindings=backend/disputes-service/internal/generated
          java_bindings=backend/accounts-service/src/main/java/com/banking/accountsservice/statements/generated
          diff -ru "$go_bindings" "$generated/$go_bindings"
          diff -ru "$java_bindings" "$generated/$java_bindings"
      - name: Verify fraud gRPC bindings
        run: |
          generated="$(mktemp -d)"
          module=github.com/dipjyotimetia/distributed-systems/backend/fraud-service
          protoc -I contracts/proto/fraud \
            --go_out="$generated" --go_opt=module="$module" \
            --go-grpc_out="$generated" --go-grpc_opt=module="$module" \
            contracts/proto/fraud/fraud.proto
          diff -ru backend/fraud-service/gen "$generated/gen"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend protobuf plugin
        working-directory: frontend
        run: npm ci
      - name: Verify internal gRPC and OpenAPI server stubs
        run: |
          python3 -m pip install --user 'grpcio-tools==1.83.2'
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.0
          bash scripts/check-contract-drift.sh
      - name: Validate movement contract and examples
        run: |
          python3 -m venv "$RUNNER_TEMP/movement-contract"
          "$RUNNER_TEMP/movement-contract/bin/pip" install openapi-spec-validator==0.7.2 openapi-schema-validator==0.6.3
          "$RUNNER_TEMP/movement-contract/bin/python" scripts/check-movement-contract.py
      - name: Cache openapi-generator CLI
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/openapi-generator
          key: openapi-generator-cli-7.14.0
      - name: Verify frontend financial clients
        run: |
          generated="$(mktemp -d)"
          bash scripts/generate-openapi-financial-clients.sh "$generated"
          for spec in transactions accounts payments; do
            diff -ru "frontend/src/gen/openapi/$spec/src" "$generated/$spec/src"
          done
      - name: Check financial HTTP compatibility with PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          go install github.com/oasdiff/oasdiff@v1.38.0
          for spec in transactions accounts payments; do
            git show "${BASE_SHA}:contracts/openapi/$spec.yaml" > "$RUNNER_TEMP/base-$spec.yaml"
            oasdiff breaking --fail-on ERR "$RUNNER_TEMP/base-$spec.yaml" "contracts/openapi/$spec.yaml"
          done
      - name: Verify frontend gRPC clients
        run: |
          generated="$(mktemp -d)"
          bash scripts/frontend-proto.sh "$generated"
          diff -ru frontend/src/gen/kyc "$generated/frontend/src/gen/kyc"
          diff -ru frontend/src/gen/cards "$generated/frontend/src/gen/cards"
      - name: Check compatibility with PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:contracts/proto/buf.yaml"; then
            git archive "$BASE_SHA" contracts/proto | tar -x -C "$RUNNER_TEMP"
            # Kafka movement lifecycle moved to contracts/avro; allow that intentional deletion.
            rm -f "$RUNNER_TEMP/contracts/proto/transactions/movement_event.proto"
            buf breaking contracts/proto --against "$RUNNER_TEMP/contracts/proto"
          fi
          if git cat-file -e "${BASE_SHA}:contracts/proto/workflows/buf.yaml"; then
            git archive "$BASE_SHA" contracts/proto/workflows | tar -x -C "$RUNNER_TEMP"
            buf breaking contracts/proto/workflows --against "$RUNNER_TEMP/contracts/proto/workflows"
          elif git cat-file -e "${BASE_SHA}:proto/workflows/buf.yaml"; then
            git archive "$BASE_SHA" proto/workflows | tar -x -C "$RUNNER_TEMP"
            buf breaking contracts/proto/workflows --against "$RUNNER_TEMP/proto/workflows"
          fi
