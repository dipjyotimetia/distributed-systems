name: Hybrid payments acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hybrid-payments-acceptance.yml'
      - 'backend/payments-service/**'
      - 'config/artemis/**'
      - 'docker-compose.mq.yml'
      - 'docker-compose.payments.yml'
      - 'frontend/e2e/payments.real-backend.spec.ts'
      - 'kubernetes/overlays/payments-*/**'
      - 'kubernetes/testing/payment-journeys/**'
      - 'tests/integration/temporal/run-payments*.sh'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target: [test-integration-payments, test-integration-payments-kind]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7.1.0
        if: matrix.target == 'test-integration-payments-kind'
        with:
          go-version-file: tests/integration/temporal/go.mod
          cache: false
      - name: Install Kind
        if: matrix.target == 'test-integration-payments-kind'
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run live hybrid acceptance
        env:
          ACCEPTANCE_TARGET: ${{ matrix.target }}
        run: make "$ACCEPTANCE_TARGET"
