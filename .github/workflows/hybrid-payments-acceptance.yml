name: Hybrid payments acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '20 19 * * 2'
  pull_request:
    paths:
      - '.github/workflows/hybrid-payments-acceptance.yml'
      - 'backend/payments-service/**'
      - 'backend/accounts-service/**'
      - 'backend/api-gateway/**'
      - 'backend/transactions-service/**'
      - 'backend/notification-service/**'
      - 'backend/fraud-service/**'
      - 'config/artemis/**'
      - 'docker-compose.yml'
      - 'docker-compose.mq.yml'
      - 'docker-compose.payments.yml'
      - 'frontend/e2e/payments.real-backend.spec.ts'
      - 'frontend/playwright.config.real-backend.ts'
      - 'frontend/package-lock.json'
      - 'kubernetes/overlays/payments-*/**'
      - 'kubernetes/testing/payment-journeys/**'
      - 'kubernetes/observability/**'
      - 'tests/integration/temporal/run-payments*.sh'
      - 'tests/integration/temporal/stack/**'
      - 'tests/integration/temporal/payment-recovery.py'
      - 'tests/integration/verify-payment-*.py'
      - 'tests/integration/temporal/verify-financial-restore.sh'
      - 'contracts/openapi/payments.yaml'
      - 'scripts/ci/build-and-load-kind-images.sh'

concurrency:
  group: hybrid-payments-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  live-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-java-gradle
      - uses: ./.github/actions/setup-node-playwright
      - name: Run live hybrid acceptance (Compose)
        env:
          BANKING_SETTLEMENT_WAIT_MINUTES: '3'
        run: make test-integration-payments

  live-kind:
    # Kind is expensive; run on schedule/dispatch, or PRs labeled kind-payments.
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'kind-payments')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-java-gradle
      - uses: ./.github/actions/setup-node-playwright
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: ./.github/actions/setup-kind
      - name: Run live hybrid acceptance (Kind)
        env:
          KIND_CLUSTER_NAME: payments-ci
          DOCKER_BUILDKIT: '1'
          BANKING_SETTLEMENT_WAIT_MINUTES: '3'
        run: make test-integration-payments-kind
