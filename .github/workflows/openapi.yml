name: OpenAPI models
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: tests/integration/temporal/go.mod
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify generated HTTP models
        run: |
          generated="$(mktemp -d)"
          bash scripts/openapi-gen.sh "$generated"
          diff -ru backend/accounts-service/src/main/java/com/banking/accountsservice/generated "$generated/backend/accounts-service/src/main/java/com/banking/accountsservice/generated"
          diff -ru backend/transactions-service/src/main/java/com/banking/transactionsservice/generated "$generated/backend/transactions-service/src/main/java/com/banking/transactionsservice/generated"
          diff -ru backend/user-service/Generated "$generated/backend/user-service/Generated"
          diff -ru backend/ai-service/generated_models.py "$generated/backend/ai-service/generated_models.py"
          diff -ru frontend/src/gen/http "$generated/frontend/src/gen/http"
          diff -ru tests/integration/temporal/gen "$generated/tests/integration/temporal/gen"
