name: Temporal integration
on:
  pull_request:
    paths:
      - '.github/workflows/temporal-integration.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.*.yml'
      - 'kubernetes/testing/**'
      - 'kubernetes/observability/**'
      - 'tests/integration/**'
      - 'scripts/ci/**'
      - 'scripts/replay/**'
      - 'tests/replay/**'
      - 'Makefile'
  workflow_dispatch:
  schedule:
    - cron: '35 18 * * 2'

concurrency:
  group: temporal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  temporal-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: tests/integration/temporal/go.mod
          cache-dependency-path: tests/integration/temporal/go.sum
      - name: Test harness
        working-directory: tests/integration/temporal
        run: go test ./...
      - uses: ./.github/actions/setup-node-playwright
      - name: Run banking journeys and browser session check
        env:
          MICROSVC_BROWSER: '1'
        run: make test-integration-temporal
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: temporal-integration-report
          path: tests/integration/temporal/results/*.json
          if-no-files-found: ignore


  ai-service-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          python-version: "3.15.2"
          cache-dependency-glob: backend/ai-service/uv.lock
      - name: Test AI service
        working-directory: backend/ai-service
        run: |
          uv sync --frozen
          uv run pytest

  knowledge-service-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          python-version: "3.15.2"
          cache-dependency-glob: backend/knowledge-service/uv.lock
      - name: Test knowledge service
        working-directory: backend/knowledge-service
        env:
          KNOWLEDGE_STORE: memory
          STORAGE_BACKEND: local
        run: |
          uv sync --frozen
          uv run pytest

  scheduled-traffic-replay:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-java-gradle
      - name: Run gateway WireMock replay
        run: make replay-gate

  kubernetes-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: ./.github/actions/setup-kind
      - name: Build and load Kind images
        env:
          DOCKER_BUILDKIT: '1'
          KIND_CLUSTER_NAME: banking-journeys
        run: |
          kind create cluster --name "$KIND_CLUSTER_NAME" --wait 120s
          bash scripts/ci/build-and-load-kind-images.sh "$KIND_CLUSTER_NAME" smoke
      - name: Deploy and check smoke and trace propagation
        run: |
          kubectl apply -k kubernetes/observability
          kubectl create namespace banking-app
          temporal_password="$(openssl rand -hex 24)"
          disputes_password="$(openssl rand -hex 24)"
          kubectl -n banking-app create secret generic banking-workflow-credentials \
            --from-literal=temporal-password="$temporal_password" \
            --from-literal=disputes-password="$disputes_password" \
            --from-literal=disputes-database-url="postgres://disputes_service_user:$disputes_password@banking-postgres:5432/banking_app?sslmode=disable"
          kubectl apply -k kubernetes/testing/journeys
          kubectl -n banking-app wait --for=condition=complete job/banking-workflow-bootstrap-v3 --timeout=5m
          kubectl -n banking-app rollout status deployment/banking-kafka --timeout=5m
          broker() { kubectl -n banking-app exec "$@" ; }
          # Rollout status can return before the Kafka listener accepts connections.
          for attempt in $(seq 1 30); do
            if broker deployment/banking-kafka -- rpk cluster info -X brokers=banking-kafka:9092 >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Kafka broker never became reachable" >&2
              exit 1
            fi
            sleep 2
          done
          broker deployment/banking-kafka -- rpk topic describe transaction-events -X brokers=banking-kafka:9092 ||
            broker deployment/banking-kafka -- rpk topic create transaction-events --partitions 1 --replicas 1 -X brokers=banking-kafka:9092
          broker deployment/banking-kafka -- rpk topic create ci-round-trip --partitions 1 --replicas 1 -X brokers=banking-kafka:9092
          printf 'ci-fixture\n' | broker -i deployment/banking-kafka -- rpk topic produce ci-round-trip -X brokers=banking-kafka:9092
          timeout 30s kubectl -n banking-app exec deployment/banking-kafka -- rpk topic consume ci-round-trip -n 1 -X brokers=banking-kafka:9092 | grep -q ci-fixture
          # Wait for Temporal before AI/disputes workers whose initContainers dial it.
          for name in banking-postgres banking-kafka redis mongodb banking-temporal banking-frontend banking-user banking-gateway banking-accounts banking-transactions banking-fraud banking-notification banking-ai banking-ai-worker banking-disputes banking-disputes-worker banking-statement-worker provider-fixtures; do
            kubectl -n banking-app rollout status "deployment/$name" --timeout=5m
          done
          kubectl -n observability rollout status deployment/jaeger --timeout=3m
          kubectl -n observability rollout status deployment/otel-collector --timeout=3m
          kubectl -n banking-app port-forward svc/banking-frontend 33000:80 >/tmp/forward-frontend.log 2>&1 &
          frontend_pid=$!
          kubectl -n observability port-forward svc/jaeger 33686:16686 >/tmp/forward-jaeger.log 2>&1 &
          jaeger_pid=$!
          kubectl -n banking-app port-forward svc/banking-notification 33001:80 >/tmp/forward-notification.log 2>&1 &
          notification_pid=$!
          trap 'kill "$frontend_pid" "$jaeger_pid" "$notification_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:33000/api/v1/healthz >/dev/null
          python3 tests/integration/kubernetes-smoke.py http://127.0.0.1:33000 http://127.0.0.1:33686 http://127.0.0.1:33001 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect cluster diagnostics
        if: failure()
        continue-on-error: true
        run: |
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "No Kind cluster available (build likely failed before create)."
            exit 0
          fi
          for namespace in banking-app observability; do
            kubectl -n "$namespace" get pods,services,pvc || true
            kubectl -n "$namespace" get events --sort-by=.lastTimestamp || true
          done
          for name in banking-postgres banking-kafka mongodb banking-accounts banking-gateway banking-transactions banking-notification banking-ai banking-ai-worker banking-disputes banking-disputes-worker banking-temporal; do
            kubectl -n banking-app logs "deployment/$name" --all-containers --tail=80 || true
          done
