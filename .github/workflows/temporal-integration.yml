name: Temporal integration
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '35 18 * * 2'

permissions:
  contents: read

jobs:
  temporal-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/integration/temporal/go.mod
          cache-dependency-path: tests/integration/temporal/go.sum
      - name: Test harness
        working-directory: tests/integration/temporal
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run banking journeys and browser session check
        env:
          MICROSVC_BROWSER: '1'
        run: make test-integration-temporal
      - name: Run extended consumer recovery
        if: github.event_name != 'pull_request'
        env:
          MICROSVC_SCENARIO: consumer-recovery
        run: make test-integration-temporal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-integration-report
          path: tests/integration/temporal/results/*.json
          if-no-files-found: ignore


  ai-service-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/ai-service/requirements.txt
      - name: Test AI service
        working-directory: backend/ai-service
        run: |
          python -m pip install -r requirements.txt pytest respx
          python -m pytest

  scheduled-traffic-replay:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run existing gateway replay when authorized
        env:
          PROXYMOCK_API_KEY: ${{ secrets.PROXYMOCK_API_KEY }}
        run: |
          if [ -z "$PROXYMOCK_API_KEY" ]; then
            echo 'Traffic replay skipped because PROXYMOCK_API_KEY is unavailable.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -Lfs https://downloads.speedscale.com/proxymock/install-proxymock | sh
          PROXYMOCK_REQUIRED=1 make proxymock-replay

  kubernetes-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: banking-journeys
      - name: Build and load the services used by the smoke test
        run: |
          for service in api-gateway accounts-service user-service; do
            image="microsvc-journeys/$service:checkout"
            docker build -t "$image" "backend/$service"
            kind load docker-image "$image" --name banking-journeys
          done
          docker build -t microsvc-journeys/frontend:checkout frontend
          kind load docker-image microsvc-journeys/frontend:checkout --name banking-journeys
      - name: Deploy and check smoke and trace propagation
        run: |
          kubectl apply -k kubernetes/observability
          kubectl apply -k kubernetes/testing/journeys
          for name in banking-frontend banking-user banking-gateway banking-accounts; do
            kubectl -n banking-app rollout status "deployment/$name" --timeout=5m
          done
          kubectl -n observability rollout status deployment/jaeger --timeout=3m
          kubectl -n observability rollout status deployment/otel-collector --timeout=3m
          kubectl -n banking-app port-forward svc/banking-frontend 33000:80 >/tmp/forward-frontend.log 2>&1 &
          frontend_pid=$!
          kubectl -n observability port-forward svc/jaeger 33686:16686 >/tmp/forward-jaeger.log 2>&1 &
          jaeger_pid=$!
          trap 'kill "$frontend_pid" "$jaeger_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:33000/api/healthz >/dev/null
          python3 tests/integration/kubernetes-smoke.py http://127.0.0.1:33000 http://127.0.0.1:33686 | tee -a "$GITHUB_STEP_SUMMARY"
