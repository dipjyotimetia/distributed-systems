name: Temporal integration
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '35 18 * * 2'

permissions:
  contents: read

jobs:
  temporal-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: tests/integration/temporal/go.mod
          cache-dependency-path: tests/integration/temporal/go.sum
      - name: Test harness
        working-directory: tests/integration/temporal
        run: go test ./...
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          sudo sed -i 's|http://\(archive\|security\).ubuntu.com/ubuntu|https://\1.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          npx playwright install --with-deps chromium
      - name: Run banking journeys and browser session check
        env:
          MICROSVC_BROWSER: '1'
        run: make test-integration-temporal
      - name: Run extended consumer recovery
        if: github.event_name != 'pull_request'
        env:
          MICROSVC_SCENARIO: consumer-recovery
        run: make test-integration-temporal
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: temporal-integration-report
          path: tests/integration/temporal/results/*.json
          if-no-files-found: ignore


  ai-service-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.2'
          cache: pip
          cache-dependency-path: backend/ai-service/requirements.txt
      - name: Test AI service
        working-directory: backend/ai-service
        run: |
          python -m pip install -r requirements.txt pytest==9.1.0 respx==0.23.1
          python -m pytest

  scheduled-traffic-replay:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run existing gateway replay when authorized
        env:
          PROXYMOCK_API_KEY: ${{ secrets.PROXYMOCK_API_KEY }}
        run: |
          if [ -z "$PROXYMOCK_API_KEY" ]; then
            echo 'Traffic replay skipped because PROXYMOCK_API_KEY is unavailable.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -Lfs https://downloads.speedscale.com/proxymock/install-proxymock | sh
          PROXYMOCK_REQUIRED=1 make proxymock-replay

  kubernetes-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: tests/integration/temporal/go.mod
          cache: false
      - name: Create Kind cluster
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          "$(go env GOPATH)/bin/kind" create cluster --name banking-journeys --wait 120s
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build and load the services used by the smoke test
        run: |
          for service in api-gateway accounts-service user-service transactions-service fraud-service notification-service ai-service disputes-service; do
            image="microsvc-journeys/$service:checkout"
            args=("backend/$service")
            case "$service" in accounts-service|api-gateway|payments-service|transactions-service) args=(-f "backend/$service/Dockerfile" .) ;; esac
            if ! docker build -t "$image" "${args[@]}"; then
              sleep 5
              docker build -t "$image" "${args[@]}"
            fi
            kind load docker-image "$image" --name banking-journeys
          done
          docker build -t microsvc-journeys/frontend:checkout frontend
          kind load docker-image microsvc-journeys/frontend:checkout --name banking-journeys
          docker build -f tests/integration/temporal/stack/Dockerfile -t microsvc-journeys/provider-fixtures:checkout .
          kind load docker-image microsvc-journeys/provider-fixtures:checkout --name banking-journeys
      - name: Deploy and check smoke and trace propagation
        run: |
          kubectl apply -k kubernetes/observability
          kubectl create namespace banking-app
          temporal_password="$(openssl rand -hex 24)"
          disputes_password="$(openssl rand -hex 24)"
          kubectl -n banking-app create secret generic banking-workflow-credentials \
            --from-literal=temporal-password="$temporal_password" \
            --from-literal=disputes-password="$disputes_password" \
            --from-literal=disputes-database-url="postgres://disputes_service_user:$disputes_password@banking-postgres:5432/banking_app?sslmode=disable"
          kubectl apply -k kubernetes/testing/journeys
          kubectl -n banking-app wait --for=condition=complete job/banking-workflow-bootstrap-v3 --timeout=5m
          kubectl -n banking-app rollout status deployment/banking-kafka --timeout=5m
          broker() { kubectl -n banking-app exec "$@" ; }
          broker deployment/banking-kafka -- rpk topic describe transaction-events -X brokers=banking-kafka:9092 ||
            broker deployment/banking-kafka -- rpk topic create transaction-events --partitions 1 --replicas 1 -X brokers=banking-kafka:9092
          broker deployment/banking-kafka -- rpk topic create ci-round-trip --partitions 1 --replicas 1 -X brokers=banking-kafka:9092
          printf 'ci-fixture\n' | broker -i deployment/banking-kafka -- rpk topic produce ci-round-trip -X brokers=banking-kafka:9092
          timeout 30s kubectl -n banking-app exec deployment/banking-kafka -- rpk topic consume ci-round-trip -n 1 -X brokers=banking-kafka:9092 | grep -q ci-fixture
          for name in banking-postgres banking-kafka redis mongodb banking-frontend banking-user banking-gateway banking-accounts banking-transactions banking-fraud banking-notification banking-ai banking-temporal banking-disputes banking-disputes-worker banking-statement-worker provider-fixtures; do
            kubectl -n banking-app rollout status "deployment/$name" --timeout=5m
          done
          kubectl -n observability rollout status deployment/jaeger --timeout=3m
          kubectl -n observability rollout status deployment/otel-collector --timeout=3m
          kubectl -n banking-app port-forward svc/banking-frontend 33000:80 >/tmp/forward-frontend.log 2>&1 &
          frontend_pid=$!
          kubectl -n observability port-forward svc/jaeger 33686:16686 >/tmp/forward-jaeger.log 2>&1 &
          jaeger_pid=$!
          kubectl -n banking-app port-forward svc/banking-notification 33001:80 >/tmp/forward-notification.log 2>&1 &
          notification_pid=$!
          trap 'kill "$frontend_pid" "$jaeger_pid" "$notification_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:33000/api/healthz >/dev/null
          python3 tests/integration/kubernetes-smoke.py http://127.0.0.1:33000 http://127.0.0.1:33686 http://127.0.0.1:33001 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect cluster diagnostics
        if: failure()
        run: |
          for namespace in banking-app observability; do
            kubectl -n "$namespace" get pods,services,pvc
            kubectl -n "$namespace" get events --sort-by=.lastTimestamp
          done
          for name in banking-postgres banking-kafka mongodb banking-accounts banking-gateway banking-transactions banking-notification; do
            kubectl -n banking-app logs "deployment/$name" --all-containers --tail=80 || true
          done
