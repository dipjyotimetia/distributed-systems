name: Setup Java and Gradle
description: Install Temurin JDK 25 and configure the Gradle action cache
runs:
  using: composite
  steps:
    - name: Set up Java 25
      uses: actions/setup-java@v6.3.0
      with:
        java-version: '25'
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
