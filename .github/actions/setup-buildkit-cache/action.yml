name: Set up BuildKit Actions cache
description: Make the GitHub Actions cache available to shell-based Buildx builds
runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const { ACTIONS_RESULTS_URL, ACTIONS_RUNTIME_TOKEN } = process.env;
          if (!ACTIONS_RESULTS_URL || !ACTIONS_RUNTIME_TOKEN) {
            core.warning('GitHub Actions build cache unavailable. Buildx will use its local cache.');
            return;
          }
          core.setSecret(ACTIONS_RUNTIME_TOKEN);
          core.exportVariable('ACTIONS_RESULTS_URL', ACTIONS_RESULTS_URL);
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', ACTIONS_RUNTIME_TOKEN);
