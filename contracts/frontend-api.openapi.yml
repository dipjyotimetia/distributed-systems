openapi: 3.0.3
info:
  title: Frontend Banking API
  description: Browser and journey surface. Proxied routes reuse the service schemas. A few routes exist only on the Next.js frontend.
  version: 1.0.0
servers:
  - url: /api
    description: Next.js frontend
paths:
  /accounts:
    $ref: '../backend/accounts-service/openapi.yml#/paths/~1accounts'
  /accounts/search:
    $ref: '../backend/accounts-service/openapi.yml#/paths/~1accounts~1search'
  /accounts/summary:
    $ref: '../backend/accounts-service/openapi.yml#/paths/~1accounts~1summary'
  /accounts/{accountId}:
    $ref: '../backend/accounts-service/openapi.yml#/paths/~1accounts~1{accountId}'
  /accounts/{accountId}/status:
    $ref: '../backend/accounts-service/openapi.yml#/paths/~1accounts~1{accountId}~1status'
  /accounts/{accountId}/balance:
    $ref: '../backend/accounts-service/openapi.yml#/paths/~1accounts~1{accountId}~1balance'
  /accounts/{accountId}/export-statement:
    $ref: '../backend/accounts-service/openapi.yml#/paths/~1accounts~1{accountId}~1export-statement'
  /accounts/{accountId}/transactions:
    get:
      operationId: listAccountTransactions
      summary: List transactions for an owned account
      description: The frontend rewrites this to GET /transactions?accountId=.
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '../backend/transactions-service/openapi.yml#/components/parameters/Page'
        - $ref: '../backend/transactions-service/openapi.yml#/components/parameters/Size'
        - $ref: '../backend/transactions-service/openapi.yml#/components/parameters/Sort'
      responses:
        '200':
          description: Transaction array or page
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../backend/transactions-service/openapi.yml#/components/schemas/TransactionList'
                  - $ref: '../backend/transactions-service/openapi.yml#/components/schemas/TransactionPage'
        '401':
          $ref: '../backend/transactions-service/openapi.yml#/components/responses/Unauthorized'
  /accounts/{accountId}/transactions/summary:
    get:
      operationId: summarizeAccountTransactions
      summary: Summarize transactions for an owned account
      description: The frontend rewrites this to GET /transactions/summary?accountId=.
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Transaction counts
          content:
            application/json:
              schema:
                $ref: '../backend/transactions-service/openapi.yml#/components/schemas/TransactionSummary'
        '401':
          $ref: '../backend/transactions-service/openapi.yml#/components/responses/Unauthorized'
  /transactions:
    get:
      $ref: '../backend/transactions-service/openapi.yml#/paths/~1transactions/get'
    post:
      operationId: submitTransaction
      summary: Create a transaction through the frontend alias of POST /transactions/create
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../backend/transactions-service/openapi.yml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../backend/transactions-service/openapi.yml#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          $ref: '../backend/transactions-service/openapi.yml#/components/responses/CreatedTransaction'
        '400':
          $ref: '../backend/transactions-service/openapi.yml#/components/responses/MoneyMovementRejected'
        '401':
          $ref: '../backend/transactions-service/openapi.yml#/components/responses/Unauthorized'
        '409':
          $ref: '../backend/transactions-service/openapi.yml#/components/responses/IdempotencyConflict'
  /transactions/search:
    $ref: '../backend/transactions-service/openapi.yml#/paths/~1transactions~1search'
  /transactions/recent:
    $ref: '../backend/transactions-service/openapi.yml#/paths/~1transactions~1recent'
  /transactions/summary:
    $ref: '../backend/transactions-service/openapi.yml#/paths/~1transactions~1summary'
  /transactions/{id}:
    $ref: '../backend/transactions-service/openapi.yml#/paths/~1transactions~1{id}'
  /transactions/{id}/cancel:
    $ref: '../backend/transactions-service/openapi.yml#/paths/~1transactions~1{id}~1cancel'
  /transactions/create:
    $ref: '../backend/transactions-service/openapi.yml#/paths/~1transactions~1create'
  /transactions/deposit:
    $ref: '../backend/transactions-service/openapi.yml#/paths/~1transactions~1deposit'
  /transactions/withdraw:
    $ref: '../backend/transactions-service/openapi.yml#/paths/~1transactions~1withdraw'
  /transactions/transfer:
    $ref: '../backend/transactions-service/openapi.yml#/paths/~1transactions~1transfer'
  /users/register:
    $ref: '../backend/user-service/openapi.yml#/paths/~1users~1register'
  /users/login:
    $ref: '../backend/user-service/openapi.yml#/paths/~1users~1login'
  /users/logout:
    post:
      operationId: logoutUser
      summary: Clear the frontend session cookie
      description: This route exists only on the frontend. The user service does not store a session.
      security: []
      responses:
        '204':
          description: Session cookie cleared
  /users/profile:
    $ref: '../backend/user-service/openapi.yml#/paths/~1users~1profile'
  /users/check-username:
    $ref: '../backend/user-service/openapi.yml#/paths/~1users~1check-username'
  /users/check-email:
    $ref: '../backend/user-service/openapi.yml#/paths/~1users~1check-email'
  /ai/chat:
    get:
      operationId: listAiProviders
      summary: List chat providers through the frontend
      description: The frontend rewrites this to GET /api/providers on the AI service.
      security: []
      responses:
        '200':
          description: Provider metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../backend/ai-service/openapi.yml#/components/schemas/ProviderResult'
    post:
      operationId: aiChat
      summary: Fan out a chat message through the frontend
      description: The frontend rewrites a fan-out message to POST /api/chat. A missing message is rejected here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../backend/ai-service/openapi.yml#/components/schemas/ChatRequest'
      responses:
        '200':
          description: One result per provider
          content:
            application/json:
              schema:
                $ref: '../backend/ai-service/openapi.yml#/components/schemas/ChatResponse'
        '400':
          description: Message is missing
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
              example:
                error: Message is required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
