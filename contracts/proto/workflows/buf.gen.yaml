version: v2
plugins:
  - local: protoc-gen-go
    out: backend/disputes-service
    opt: module=github.com/dipjyotimetia/distributed-systems/backend/disputes-service
    types: [banking.disputes.v1.CaseRevision, banking.disputes.v1.InvestigationState]
  - protoc_builtin: java
    protoc_path: protoc
    out: backend/accounts-service/src/main/java
    types: [banking.statements.v1.StatementJob, banking.statements.v1.StatementGeneration, banking.statements.v1.StatementExpiry]
