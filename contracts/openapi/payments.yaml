openapi: 3.0.3
info:
  title: Payments Service
  description: Outbound AUD payments and reconciliation discrepancies.
  version: 1.0.0
servers:
  - url: http://localhost:8088
    description: Local development server
paths:
  /api/payments:
    post:
      tags: [payments]
      operationId: initiatePayment
      summary: Accept an outbound payment
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInstruction'
      responses:
        '202':
          description: Payment accepted
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid outbound payment
        '401':
          description: Sign in required
  /api/payments/{id}:
    get:
      tags: [payments]
      operationId: getPayment
      summary: Read an owned payment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          description: Sign in required
        '404':
          description: Payment not found
  /api/operations/payments/reconciliation:
    get:
      tags: [payments]
      operationId: listDiscrepancies
      summary: List unmatched reconciliation rows
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Discrepancies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Discrepancy'
        '400':
          description: Invalid offset
        '401':
          description: Sign in required
        '403':
          description: Operator access required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaymentInstruction:
      type: object
      required: [accountId, destination, amountMinor]
      properties:
        accountId:
          type: integer
          format: int64
        destination:
          type: string
        amountMinor:
          type: integer
          format: int64
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instruction:
          $ref: '#/components/schemas/PaymentInstruction'
        status:
          type: string
        clearingReference:
          type: string
        createdAt:
          type: string
          format: date-time
        settlementBusinessDate:
          type: string
          format: date
    Discrepancy:
      type: object
      properties:
        businessDate:
          type: string
          format: date
        recordNumber:
          type: integer
        paymentId:
          type: string
          format: uuid
        outcome:
          type: string
        expectedAmountMinor:
          type: integer
          format: int64
        observedAmountMinor:
          type: integer
          format: int64
        observedReference:
          type: string
