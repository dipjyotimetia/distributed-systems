openapi: 3.0.3
info:
  title: Accounts Service
  description: API for managing bank accounts.
  version: v1
servers:
- url: http://localhost:8082
  description: Local development server
paths:
  /api/v2/accounts/{accountId}/balances:
    parameters:
      - {name: accountId, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      tags: [exactAccounts]
      operationId: getExactBalances
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Consistent owned account snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExactBalances'}
              example: {currency: AUD, postedBalance: '100.00', heldAmount: '20.00', availableBalance: '80.00', asOf: '2026-11-21T02:00:00Z'}
        '401': {description: Authentication required}
        '404': {description: Unknown or foreign account}
  /api/v2/accounts/{accountId}/statement-jobs:
    parameters:
      - {name: accountId, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      tags: [exactAccounts]
      operationId: createPeriodStatement
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StatementPeriod'}
            example: {start: '2026-11-01T00:00:00Z', end: '2026-11-02T00:00:00Z'}
      responses:
        '202':
          description: Statement job queued
          headers:
            Location: {required: true, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatementJob'}
        '400': {description: Invalid period}
        '401': {description: Authentication required}
        '404': {description: Unknown or foreign account}
        '422': {description: Period starts before posting coverage or ends in the future}
  /api/v2/accounts/{accountId}/statement-jobs/{jobId}:
    parameters:
      - {name: accountId, in: path, required: true, schema: {type: integer, format: int64}}
      - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [exactAccounts]
      operationId: getPeriodStatement
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The current job status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatementJob'}
        '401': {description: Authentication required}
        '404': {description: Unknown or foreign job}
  /api/v2/accounts/{accountId}/statement-jobs/{jobId}/download:
    parameters:
      - {name: accountId, in: path, required: true, schema: {type: integer, format: int64}}
      - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [exactAccounts]
      operationId: downloadPeriodStatement
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Period statement, available for seven days after generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PeriodStatement'}
        '401': {description: Authentication required}
        '404': {description: Unknown or foreign job}
        '409': {description: Statement generation is pending}
        '410': {description: Statement expired}
  /api/v1/accounts:
    get:
      summary: Get all accounts for the authenticated user
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Type'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Account array, or an account page when page or size is supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListOrPage'
      tags:
      - accounts
      operationId: listAccounts
    post:
      summary: Create a new account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
      tags:
      - accounts
      operationId: createAccount
  /api/v1/accounts/search:
    get:
      summary: Search owned accounts by number or type
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Type'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Account array, or an account page when page or size is supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListOrPage'
      tags:
      - accounts
      operationId: searchAccounts
  /api/v1/accounts/summary:
    get:
      summary: Summarize owned accounts
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Account counts and balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
      tags:
      - accounts
      operationId: summarizeAccounts
  /api/v1/accounts/{accountId}:
    get:
      summary: Get account by ID
      security:
      - bearerAuth: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Account not found
      tags:
      - accounts
      operationId: getAccount
    put:
      summary: Update an owned account's type or status
      security:
      - bearerAuth: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid account update
        '404':
          description: Account not found
        '409':
          description: Closed account, invalid transition, nonzero closing balance, or reserved movement
      tags:
      - accounts
      operationId: updateAccount
    delete:
      summary: Close an owned zero-balance account
      security:
      - bearerAuth: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Account closed or already closed
        '404':
          description: Account not found
        '409':
          description: Account has a balance or reserved movement
      tags:
      - accounts
      operationId: closeAccount
  /api/v1/accounts/{accountId}/status:
    patch:
      summary: Freeze, unfreeze, or close an owned account
      security:
      - bearerAuth: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      responses:
        '200':
          description: Account status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Missing account status
        '404':
          description: Account not found
        '409':
          description: Invalid transition, nonzero closing balance, or reserved movement
      tags:
      - accounts
      operationId: updateAccountStatus
  /api/v1/accounts/{accountId}/balance:
    get:
      summary: Get account balance
      security:
      - bearerAuth: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '404':
          description: Account not found
      tags:
      - accounts
      operationId: getAccountBalance
    put:
      summary: Update account balance
      security:
      - bearerAuth: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceUpdateRequest'
      responses:
        '200':
          description: Balance updated successfully
        '404':
          description: Account not found
      tags:
      - accounts
      operationId: updateAccountBalance
  /api/v1/accounts/{accountId}/export-statement:
    post:
      tags:
      - accounts
      operationId: exportStatement
      summary: Export an account statement
      security:
      - bearerAuth: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Generated or exported statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementExport'
        '500':
          description: Export failed
  /api/v1/accounts/{accountId}/statement-jobs:
    post:
      tags:
      - statement-jobs
      operationId: createStatementJob
      summary: Start a statement export job
      security:
      - bearerAuth: []
      parameters:
      - &id001
        name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementJob'
        '400':
          description: Invalid statement job request
    get:
      tags:
      - statement-jobs
      operationId: listStatementJobs
      summary: List statement jobs
      security:
      - bearerAuth: []
      parameters:
      - *id001
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Job page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementJobPage'
  /api/v1/accounts/{accountId}/statement-jobs/{jobId}:
    get:
      tags:
      - statement-jobs
      operationId: getStatementJob
      summary: Read a statement job
      security:
      - bearerAuth: []
      parameters:
      - *id001
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementJob'
        '404':
          description: Job not found
  /api/v1/accounts/{accountId}/statement-jobs/{jobId}/download:
    get:
      tags:
      - statement-jobs
      operationId: downloadStatementJob
      summary: Download a finished statement
      security:
      - bearerAuth: []
      parameters:
      - *id001
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Statement JSON file
          content:
            application/json:
              schema:
                type: string
                format: binary
        '404':
          description: Job not found
components:
  parameters:
    Type:
      name: type
      in: query
      schema:
        type: string
        enum:
        - CHECKING
        - SAVINGS
        - CREDIT
        - INVESTMENT
    Status:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/AccountStatus'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: createdAt,desc
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ExactBalances:
      type: object
      required: [currency, postedBalance, heldAmount, availableBalance, asOf]
      properties:
        currency: {type: string}
        postedBalance: {type: string}
        heldAmount: {type: string}
        availableBalance: {type: string}
        asOf: {type: string, format: date-time}
        postingCoverageStart: {type: string, format: date-time}
    StatementPeriod:
      type: object
      required: [start, end]
      properties:
        start: {type: string, format: date-time, description: Inclusive UTC boundary}
        end: {type: string, format: date-time, description: Exclusive UTC boundary}
    PeriodStatement:
      type: object
      required: [schemaVersion, accountId, period, currency, openingBalance, entries, closingBalance, generatedAt]
      properties:
        schemaVersion: {type: integer, enum: [2]}
        accountId: {type: integer, format: int64}
        period: {$ref: '#/components/schemas/StatementPeriod'}
        currency: {type: string}
        openingBalance: {type: string}
        entries:
          type: array
          items: {$ref: '#/components/schemas/PostedEntry'}
        closingBalance: {type: string}
        generatedAt: {type: string, format: date-time}
    PostedEntry:
      type: object
      required: [id, operationId, amount, postedAt, source]
      properties:
        id: {type: integer, format: int64}
        operationId: {type: string, format: uuid}
        amount: {type: string}
        postedAt: {type: string, format: date-time}
        source: {type: string}
    AccountStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - FROZEN
      - CLOSED
    AccountListOrPage:
      description: Account array, or an account page when page or size is supplied
      nullable: true
      x-java-type: java.lang.Object
      oneOf:
      - type: array
        items:
          $ref: '#/components/schemas/AccountResponse'
      - $ref: '#/components/schemas/AccountPage'
    AccountPage:
      type: object
      required:
      - content
      - pageable
      - last
      - totalPages
      - totalElements
      - size
      - number
      - sort
      - first
      - numberOfElements
      - empty
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
        pageable:
          type: object
        sort:
          type: object
        last:
          type: boolean
        first:
          type: boolean
        empty:
          type: boolean
        totalPages:
          type: integer
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
        number:
          type: integer
        numberOfElements:
          type: integer
    AccountSummary:
      type: object
      properties:
        totalAccounts:
          type: integer
          format: int64
        activeAccounts:
          type: integer
          format: int64
        totalBalance:
          type: number
        accountsByType:
          type: object
          additionalProperties:
            type: integer
            format: int64
    AccountResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        accountNumber:
          type: string
        balance:
          type: number
        accountType:
          type: string
        currency:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
        updatedAt:
          type: string
    AccountCreateRequest:
      type: object
      required:
      - accountType
      properties:
        accountType:
          type: string
          enum:
          - CHECKING
          - SAVINGS
          - CREDIT
          - INVESTMENT
        initialBalance:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          default: USD
    BalanceResponse:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
        currency:
          type: string
        balance:
          type: number
        accountNumber:
          type: string
    StatementExport:
      type: object
      properties:
        status:
          type: string
        key:
          type: string
        statement:
          type: object
          additionalProperties: true
    StatementJob:
      type: object
      required:
      - id
      - status
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    StatementJobPage:
      type: object
      required:
      - items
      - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StatementJob'
        hasMore:
          type: boolean
    AccountUpdateRequest:
      type: object
      properties:
        accountType:
          type: string
          enum:
          - CHECKING
          - SAVINGS
          - CREDIT
          - INVESTMENT
        status:
          type: string
          enum:
          - ACTIVE
          - FROZEN
          - CLOSED
    StatusUpdateRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - FROZEN
          - CLOSED
    BalanceUpdateRequest:
      type: object
      required:
      - balance
      properties:
        balance:
          type: number
