openapi: 3.0.3
info:
  title: Transactions Service
  description: API for managing financial transactions.
  version: v1
servers:
- url: http://localhost:8083
  description: Local development server
paths:
  /api/v1/movements:
    post:
      tags: [movements]
      operationId: submitMovement
      summary: Durably accept a movement
      description: >
        The key is scoped to the authenticated customer across all movement types.
        A retry with the same normalized intent returns the same ID and current
        status without repeating screening, even during a screening outage.
        Reuse with a different intent returns 409. The key is retained for the
        lifetime of the movement.
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[!-~]+$'
        example: 831b64b8-f015-4656-ac04-c69a557118a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementIntent'
            examples:
              transfer:
                value:
                  type: TRANSFER
                  fromAccountId: 12
                  toAccountId: 34
                  money: {currency: AUD, amount: '25.50'}
              deposit:
                value:
                  type: DEPOSIT
                  toAccountId: 34
                  money: {currency: AUD, amount: '10.00'}
              withdrawal:
                value:
                  type: WITHDRAWAL
                  fromAccountId: 12
                  money: {currency: AUD, amount: '10.00'}
      responses:
        '202':
          description: Accepted intent or the current outcome of a same-key retry
          headers:
            Location:
              required: true
              schema:
                type: string
              example: /api/v1/movements/521155ce-1234-4e81-b47e-93579acc4859
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementOutcome'
              examples:
                accepted:
                  value:
                    id: 521155ce-1234-4e81-b47e-93579acc4859
                    status: PENDING
                    createdAt: '2026-11-21T01:00:00Z'
                    updatedAt: '2026-11-21T01:00:00Z'
                lostResponseRetry:
                  value:
                    id: 521155ce-1234-4e81-b47e-93579acc4859
                    status: POSTED
                    createdAt: '2026-11-21T01:00:00Z'
                    updatedAt: '2026-11-21T01:00:01Z'
        '400':
          $ref: '#/components/responses/InvalidMovementRequest'
        '401':
          $ref: '#/components/responses/MovementAuthenticationRequired'
        '404':
          $ref: '#/components/responses/MovementResourceNotFound'
        '409':
          description: The key is already associated with a different intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementError'
              example: {code: IDEMPOTENCY_KEY_REUSED}
        '422':
          description: Business validation failed before the intent was accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementError'
              example: {code: CURRENCY_MISMATCH}
  /api/v1/movements/{id}:
    get:
      tags: [movements]
      operationId: getMovement
      summary: Look up a movement owned by the authenticated customer
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The latest durable movement outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementOutcome'
              examples:
                posted:
                  value:
                    id: 521155ce-1234-4e81-b47e-93579acc4859
                    status: POSTED
                    createdAt: '2026-11-21T01:00:00Z'
                    updatedAt: '2026-11-21T01:00:01Z'
                screeningUnavailable:
                  value:
                    id: 521155ce-1234-4e81-b47e-93579acc4859
                    status: PENDING
                    reasonCode: SCREENING_UNAVAILABLE
                    createdAt: '2026-11-21T01:00:00Z'
                    updatedAt: '2026-11-21T01:00:01Z'
                insufficientFunds:
                  value:
                    id: 521155ce-1234-4e81-b47e-93579acc4859
                    status: REJECTED
                    reasonCode: INSUFFICIENT_AVAILABLE_FUNDS
                    createdAt: '2026-11-21T01:00:00Z'
                    updatedAt: '2026-11-21T01:00:01Z'
        '400':
          $ref: '#/components/responses/InvalidMovementRequest'
        '401':
          $ref: '#/components/responses/MovementAuthenticationRequired'
        '404':
          $ref: '#/components/responses/MovementResourceNotFound'
  /api/v1/transactions:
    get:
      summary: Get all transactions for the authenticated user
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/type'
      - $ref: '#/components/parameters/status'
      - $ref: '#/components/parameters/startDate'
      - $ref: '#/components/parameters/endDate'
      - $ref: '#/components/parameters/minAmount'
      - $ref: '#/components/parameters/maxAmount'
      - $ref: '#/components/parameters/description'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Transaction array, or a transaction page when page or size is supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListOrPage'
        '404':
          description: Account not found
      tags:
      - transactions
      operationId: listTransactions
  /api/v1/transactions/search:
    get:
      summary: Search owned transactions
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/type'
      - $ref: '#/components/parameters/status'
      - $ref: '#/components/parameters/startDate'
      - $ref: '#/components/parameters/endDate'
      - $ref: '#/components/parameters/minAmount'
      - $ref: '#/components/parameters/maxAmount'
      - $ref: '#/components/parameters/description'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Transaction array, or a transaction page when page or size is supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListOrPage'
      tags:
      - transactions
      operationId: searchTransactions
  /api/v1/transactions/recent:
    get:
      summary: Read the newest owned transactions
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      responses:
        '200':
          description: Newest transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
      tags:
      - transactions
      operationId: recentTransactions
  /api/v1/transactions/summary:
    get:
      summary: Count owned transactions by type and status
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          description: Transaction counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSummary'
        '404':
          description: Account not found
      tags:
      - transactions
      operationId: summarizeTransactions
  /api/v1/transactions/{id}:
    parameters:
    - $ref: '#/components/parameters/TransactionId'
    get:
      summary: Read an owned transaction
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/TransactionRecord'
        '404':
          description: Transaction not found
      tags:
      - transactions
      operationId: getTransaction
  /api/v1/transactions/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/TransactionId'
    patch:
      summary: Cancel an owned pending transaction
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/TransactionRecord'
        '404':
          description: Transaction not found
        '409':
          description: Transaction has already settled
      tags:
      - transactions
      operationId: cancelTransaction
  /api/v1/transactions/create:
    post:
      summary: Dispatch a generic transaction by type
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              - type
              - amount
              - currency
              properties:
                accountId:
                  type: integer
                  format: int64
                toAccountId:
                  type: integer
                  format: int64
                type:
                  type: string
                  enum:
                  - DEPOSIT
                  - WITHDRAWAL
                  - TRANSFER
                amount:
                  type: number
                currency:
                  type: string
                  pattern: '^[A-Z]{3}$'
                description:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/TransactionRecord'
        '400':
          description: Insufficient funds return an INSUFFICIENT_FUNDS body. Validation failures return a field map or an empty body.
      tags:
      - transactions
      operationId: createTransaction
  /api/v1/transactions/deposit:
    post:
      summary: Deposit funds into an account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '201':
          description: Deposit successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Insufficient funds return an INSUFFICIENT_FUNDS body. Validation failures return a field map. Other rejections use this status with an empty body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rejection'
      tags:
      - transactions
      operationId: deposit
  /api/v1/transactions/withdraw:
    post:
      summary: Withdraw funds from an account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '201':
          description: Withdrawal successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Insufficient funds return an INSUFFICIENT_FUNDS body. Validation failures return a field map. Fraud and other rejections use this status with an empty body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rejection'
      tags:
      - transactions
      operationId: withdraw
  /api/v1/transactions/transfer:
    post:
      summary: Transfer funds between accounts
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Transfer successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Insufficient funds return an INSUFFICIENT_FUNDS body. Validation failures return a field map. Fraud and other rejections use this status with an empty body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rejection'
      tags:
      - transactions
      operationId: transfer
components:
  parameters:
    accountId:
      name: accountId
      in: query
      schema:
        type: integer
        format: int64
    type:
      name: type
      in: query
      schema:
        type: string
    status:
      name: status
      in: query
      schema:
        type: string
    startDate:
      name: startDate
      in: query
      schema:
        type: string
    endDate:
      name: endDate
      in: query
      schema:
        type: string
    minAmount:
      name: minAmount
      in: query
      schema:
        type: number
    maxAmount:
      name: maxAmount
      in: query
      schema:
        type: number
    description:
      name: description
      in: query
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
    size:
      name: size
      in: query
      schema:
        type: integer
    sort:
      name: sort
      in: query
      schema:
        type: string
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    InvalidMovementRequest:
      description: Invalid request or missing required idempotency key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MovementError'
          example: {code: INVALID_INPUT}
    MovementAuthenticationRequired:
      description: Missing or invalid customer credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MovementError'
          example: {code: UNAUTHENTICATED}
    MovementResourceNotFound:
      description: Unknown resource or resource owned by another customer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MovementError'
          example: {code: NOT_FOUND}
    TransactionRecord:
      description: Transaction record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MovementIntent:
      type: object
      additionalProperties: false
      required: [type, money]
      description: >
        Supply only toAccountId for DEPOSIT, only fromAccountId for
        WITHDRAWAL, and two distinct account IDs for TRANSFER. The caller
        must own the source account, or the destination for a deposit.
      properties:
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL, TRANSFER]
        fromAccountId:
          type: integer
          format: int64
          minimum: 1
        toAccountId:
          type: integer
          format: int64
          minimum: 1
        money:
          $ref: '#/components/schemas/MovementMoney'
        description:
          type: string
          maxLength: 255
    MovementMoney:
      type: object
      additionalProperties: false
      required: [currency, amount]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Supported account currency as an ISO 4217 code.
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)([.][0-9]+)?$'
          maxLength: 20
          description: Positive exact amount within the supported currency scale. Excess precision is rejected.
    MovementOutcome:
      type: object
      required: [id, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, POSTED, REJECTED]
          description: >
            POSTED requires durable account posting. REJECTED requires
            confirmation that no posting occurred and any hold was released.
        reasonCode:
          type: string
          description: Machine-readable reason for a pending or rejected outcome.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MovementError:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
    TransactionListOrPage:
      description: Transaction array, or a transaction page when page or size is supplied
      nullable: true
      x-java-type: java.lang.Object
      oneOf:
      - $ref: '#/components/schemas/TransactionList'
      - $ref: '#/components/schemas/TransactionPage'
    TransactionList:
      type: array
      items:
        $ref: '#/components/schemas/TransactionResponse'
    TransactionPage:
      type: object
      required:
      - content
      - pageable
      - last
      - totalPages
      - totalElements
      - size
      - number
      - sort
      - first
      - numberOfElements
      - empty
      properties:
        content:
          $ref: '#/components/schemas/TransactionList'
        pageable:
          type: object
        sort:
          type: object
        last:
          type: boolean
        first:
          type: boolean
        empty:
          type: boolean
        totalPages:
          type: integer
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
        number:
          type: integer
        numberOfElements:
          type: integer
    TransactionSummary:
      type: object
      properties:
        totalTransactions:
          type: integer
          format: int64
        totalDeposits:
          type: integer
          format: int64
        totalWithdrawals:
          type: integer
          format: int64
        totalTransfers:
          type: integer
          format: int64
        pendingTransactions:
          type: integer
          format: int64
        completedTransactions:
          type: integer
          format: int64
        failedTransactions:
          type: integer
          format: int64
        transactionsByType:
          type: object
          additionalProperties:
            type: integer
            format: int64
        transactionsByStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        fromAccountId:
          type: integer
          format: int64
          nullable: true
        toAccountId:
          type: integer
          format: int64
          nullable: true
        amount:
          type: number
        type:
          type: string
        status:
          type: string
        processedAt:
          type: string
        timestamp:
          type: string
          format: date-time
    DepositRequest:
      type: object
      required:
      - accountId
      - amount
      properties:
        accountId:
          type: integer
          format: int64
        amount:
          type: number
        description:
          type: string
    WithdrawRequest:
      type: object
      required:
      - accountId
      - amount
      properties:
        accountId:
          type: integer
          format: int64
        amount:
          type: number
        description:
          type: string
    TransferRequest:
      type: object
      required:
      - fromAccountId
      - toAccountId
      - amount
      properties:
        fromAccountId:
          type: integer
          format: int64
        toAccountId:
          type: integer
          format: int64
        amount:
          type: number
        description:
          type: string
    Rejection:
      description: Confirmed insufficient funds, or a validation field map. Fraud and other rejections use HTTP 400 with an empty body and are not this schema.
      oneOf:
      - $ref: '#/components/schemas/InsufficientFunds'
      - $ref: '#/components/schemas/FieldErrors'
    FieldErrors:
      type: object
      description: Validation errors keyed by request field.
      additionalProperties:
        type: string
    InsufficientFunds:
      type: object
      description: Present when the ledger rejects a confirmed insufficient balance.
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - INSUFFICIENT_FUNDS
        message:
          type: string
