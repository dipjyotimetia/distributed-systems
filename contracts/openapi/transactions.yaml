openapi: 3.0.3
info:
  title: Transactions Service
  description: API for managing financial transactions.
  version: v1
servers:
- url: http://localhost:8083
  description: Local development server
paths:
  /api/v1/transactions:
    get:
      summary: Get all transactions for the authenticated user
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/type'
      - $ref: '#/components/parameters/status'
      - $ref: '#/components/parameters/startDate'
      - $ref: '#/components/parameters/endDate'
      - $ref: '#/components/parameters/minAmount'
      - $ref: '#/components/parameters/maxAmount'
      - $ref: '#/components/parameters/description'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Transaction array or a page when page or size is supplied
          content:
            application/json:
              schema:
                description: Transaction array or a page when page or size is supplied
                nullable: true
                x-java-type: java.lang.Object
        '404':
          description: Account not found
      tags:
      - transactions
      operationId: listTransactions
  /api/v1/transactions/search:
    get:
      summary: Search owned transactions
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/type'
      - $ref: '#/components/parameters/status'
      - $ref: '#/components/parameters/startDate'
      - $ref: '#/components/parameters/endDate'
      - $ref: '#/components/parameters/minAmount'
      - $ref: '#/components/parameters/maxAmount'
      - $ref: '#/components/parameters/description'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Matching transaction page
          content:
            application/json:
              schema:
                description: Matching transaction page
                nullable: true
                x-java-type: java.lang.Object
      tags:
      - transactions
      operationId: searchTransactions
  /api/v1/transactions/recent:
    get:
      summary: Read the newest owned transactions
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      responses:
        '200':
          description: Newest transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
      tags:
      - transactions
      operationId: recentTransactions
  /api/v1/transactions/summary:
    get:
      summary: Count owned transactions by type and status
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          description: Transaction counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSummary'
        '404':
          description: Account not found
      tags:
      - transactions
      operationId: summarizeTransactions
  /api/v1/transactions/{id}:
    parameters:
    - $ref: '#/components/parameters/TransactionId'
    get:
      summary: Read an owned transaction
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/TransactionRecord'
        '404':
          description: Transaction not found
      tags:
      - transactions
      operationId: getTransaction
  /api/v1/transactions/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/TransactionId'
    patch:
      summary: Cancel an owned pending transaction
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/TransactionRecord'
        '404':
          description: Transaction not found
        '409':
          description: Transaction has already settled
      tags:
      - transactions
      operationId: cancelTransaction
  /api/v1/transactions/create:
    post:
      summary: Dispatch a generic transaction by type
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              - type
              - amount
              properties:
                accountId:
                  type: integer
                  format: int64
                toAccountId:
                  type: integer
                  format: int64
                type:
                  type: string
                  enum:
                  - DEPOSIT
                  - WITHDRAWAL
                  - TRANSFER
                amount:
                  type: number
                description:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/TransactionRecord'
        '400':
          description: Rejected request. Confirmed insufficient funds include the INSUFFICIENT_FUNDS code.
      tags:
      - transactions
      operationId: createTransaction
  /api/v1/transactions/deposit:
    post:
      summary: Deposit funds into an account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '201':
          description: Deposit successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
      tags:
      - transactions
      operationId: deposit
  /api/v1/transactions/withdraw:
    post:
      summary: Withdraw funds from an account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '201':
          description: Withdrawal successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Rejected request. Confirmed insufficient funds include the INSUFFICIENT_FUNDS code.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - INSUFFICIENT_FUNDS
                  message:
                    type: string
      tags:
      - transactions
      operationId: withdraw
  /api/v1/transactions/transfer:
    post:
      summary: Transfer funds between accounts
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Transfer successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Rejected request. Confirmed insufficient funds include the INSUFFICIENT_FUNDS code.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - INSUFFICIENT_FUNDS
                  message:
                    type: string
      tags:
      - transactions
      operationId: transfer
components:
  parameters:
    accountId:
      name: accountId
      in: query
      schema:
        type: integer
        format: int64
    type:
      name: type
      in: query
      schema:
        type: string
    status:
      name: status
      in: query
      schema:
        type: string
    startDate:
      name: startDate
      in: query
      schema:
        type: string
    endDate:
      name: endDate
      in: query
      schema:
        type: string
    minAmount:
      name: minAmount
      in: query
      schema:
        type: number
    maxAmount:
      name: maxAmount
      in: query
      schema:
        type: number
    description:
      name: description
      in: query
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
    size:
      name: size
      in: query
      schema:
        type: integer
    sort:
      name: sort
      in: query
      schema:
        type: string
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    TransactionRecord:
      description: Transaction record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TransactionList:
      type: array
      items:
        $ref: '#/components/schemas/TransactionResponse'
    TransactionPage:
      type: object
      required:
      - content
      - pageable
      - last
      - totalPages
      - totalElements
      - size
      - number
      - sort
      - first
      - numberOfElements
      - empty
      properties:
        content:
          $ref: '#/components/schemas/TransactionList'
        pageable:
          type: object
        sort:
          type: object
        last:
          type: boolean
        first:
          type: boolean
        empty:
          type: boolean
        totalPages:
          type: integer
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
        number:
          type: integer
        numberOfElements:
          type: integer
    TransactionSummary:
      type: object
      properties:
        totalTransactions:
          type: integer
          format: int64
        totalDeposits:
          type: integer
          format: int64
        totalWithdrawals:
          type: integer
          format: int64
        totalTransfers:
          type: integer
          format: int64
        pendingTransactions:
          type: integer
          format: int64
        completedTransactions:
          type: integer
          format: int64
        failedTransactions:
          type: integer
          format: int64
        transactionsByType:
          type: object
          additionalProperties:
            type: integer
            format: int64
        transactionsByStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fromAccountId:
          type: integer
          format: int64
          nullable: true
        toAccountId:
          type: integer
          format: int64
          nullable: true
        amount:
          type: number
        type:
          type: string
        status:
          type: string
        timestamp:
          type: string
          format: date-time
    DepositRequest:
      type: object
      required:
      - accountId
      - amount
      properties:
        accountId:
          type: integer
          format: int64
        amount:
          type: number
    WithdrawRequest:
      type: object
      required:
      - accountId
      - amount
      properties:
        accountId:
          type: integer
          format: int64
        amount:
          type: number
    TransferRequest:
      type: object
      required:
      - fromAccountId
      - toAccountId
      - amount
      properties:
        fromAccountId:
          type: integer
          format: int64
        toAccountId:
          type: integer
          format: int64
        amount:
          type: number
